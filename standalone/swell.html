<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swell</title>
<style>
  :root {
    --paper: #FBFAF6;
    --ink: #1A222E;
    --soft: #7A8290;
    --faint: #B4BAC4;
    --line: #E4E0D7;
    --accent: #CF4824;
    --red: #C0392B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1520px; margin: 0 auto; padding: 48px 64px 40px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .mark {
    font-family: "Gabriola", "French Script MT", "Segoe Script", cursive;
    font-size: 150px;
    line-height: 0.95;
    font-style: italic;
    color: var(--red);
    margin-left: -8px;
    margin-bottom: 16px;
    user-select: none;
  }
  .brand .en { margin-top: 2px; font-size: 12px; letter-spacing: 0.36em; color: var(--faint); }
  .brand .sub { margin-top: 10px; font-size: 15px; color: var(--soft); }
  .meta { text-align: right; font-size: 13px; color: var(--faint); line-height: 1.9; }
  .kbd { letter-spacing: 0.04em; }

  .rule { height: 1px; background: var(--line); margin: 24px 0 38px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    box-shadow: 0 2px 10px rgba(26,34,46,0.04);
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(192,57,43,0.4);
    box-shadow: 0 18px 44px rgba(26,34,46,0.12);
  }

  .preview { position: relative; height: 320px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .preview canvas { display: block; width: 100%; height: 100%; }

  .body { padding: 24px 30px 28px; }
  .name { display: flex; align-items: baseline; gap: 14px; }
  .name h2 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.05em; }
  .name .en { font-size: 11px; letter-spacing: 0.3em; color: var(--faint); }
  .desc { margin: 12px 0 0; font-size: 15px; line-height: 1.75; color: var(--soft); }
  .tags { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag {
    font-size: 12px; color: var(--soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px;
  }
  .enter {
    margin-top: 20px; display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--accent); font-weight: 600;
  }
  .card:hover .enter svg { transform: translateX(5px); }
  .enter svg { transition: transform .22s ease; }

  .num {
    position: absolute; top: 16px; left: 22px;
    font-size: 12px; letter-spacing: 0.2em; color: var(--faint);
  }

  footer { margin-top: 44px; display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }

  /* 游戏层 */
  #stage {
    position: fixed; inset: 0;
    background: var(--paper);
    display: none;
    z-index: 10;
  }
  #stage.on { display: block; }
  #frame { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
  #back {
    position: fixed; left: 18px; top: 16px; z-index: 20;
    display: none; align-items: center; justify-content: center;
    width: 38px; height: 38px; padding: 0;
    border: 1px solid var(--line); border-radius: 50%;
    background: rgba(251,250,246,0.92);
    color: var(--soft); cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #back.on { display: flex; }
  #back:hover { color: var(--accent); border-color: rgba(207,72,36,0.45); }
  #back svg { width: 15px; height: 15px; }

  @media (max-width: 1100px) {
    .wrap { padding: 30px 24px 30px; }
    .cards { grid-template-columns: 1fr; gap: 22px; }
    .mark { font-size: 118px; }
    .preview { height: 240px; }
  }
</style>
</head>
<body>
<div class="wrap" id="home">
  <header>
    <div class="brand">
      <div class="mark">f</div>
      <div class="en">S W E L L</div>
      <div class="sub">两个关于波的小游戏</div>
    </div>
    <div class="meta">
      <div class="kbd">键盘 1 / 2 直接进入</div>
    </div>
  </header>

  <div class="rule"></div>

  <div class="cards">
    <div class="card" data-game="wave">
      <div class="num">01</div>
      <div class="preview"><canvas id="p1"></canvas></div>
      <div class="body">
        <div class="name"><h2>波相</h2><span class="en">WAVEPHASE</span></div>
        <p class="desc">拖动振幅、波长、相位，让一条曲线同时穿过所有圆环。五关递进，外加一个随机生成的自由模式。</p>
        <div class="tags"><span class="tag">三角函数</span><span class="tag">参数联想</span></div>
        <div class="enter">进入
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 6h15M11 1l5 5-5 5" stroke="#CF4824" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>

    <div class="card" data-game="harm">
      <div class="num">02</div>
      <div class="preview"><canvas id="p2"></canvas></div>
      <div class="body">
        <div class="name"><h2>谐律</h2><span class="en">HARMONIC</span></div>
        <p class="desc">几条正弦各自游荡，把相位对准，它们就叠成一段和声。</p>
        <div class="tags"><span class="tag">傅里叶</span><span class="tag">解谜</span><span class="tag">合成音色</span></div>
        <div class="enter">进入
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 6h15M11 1l5 5-5 5" stroke="#CF4824" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span>两个独立作品，共享同一套纸墨语言</span>
    <span>Esc 返回</span>
  </footer>
</div>

<div id="stage"><iframe id="frame" title="game"></iframe></div>
<button id="back" type="button" title="返回（Esc）" aria-label="返回">
  <svg viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const back = document.getElementById('back');
  const home = document.getElementById('home');

  function decode(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function openGame(key) {
    if (!GAMES[key]) return;
    frame.srcdoc = decode(GAMES[key]);
    stage.classList.add('on');
    back.classList.add('on');
    home.style.visibility = 'hidden';
    history.replaceState(null, '', '#/' + key);
  }

  function closeGame() {
    stage.classList.remove('on');
    back.classList.remove('on');
    home.style.visibility = 'visible';
    frame.srcdoc = '';
    history.replaceState(null, '', location.pathname);
  }

  frame.addEventListener('load', () => {
    try {
      frame.contentWindow.focus();
      frame.contentDocument.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeGame();
      });
    } catch (err) { /* 忽略 */ }
  });

  document.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('click', () => openGame(card.dataset.game));
  });
  back.addEventListener('click', closeGame);

  window.addEventListener('keydown', (e) => {
    if (stage.classList.contains('on')) return;
    if (e.key === '1') openGame('wave');
    if (e.key === '2') openGame('harm');
  });

  if (location.hash === '#/wave') openGame('wave');
  if (location.hash === '#/harm') openGame('harm');

  // ---------------------------------------------------------------- 预览动画
  const ACCENT = '#CF4824';
  const RED = '#C0392B';

  function setup(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w: rect.width, h: rect.height };
  }

  const c1 = document.getElementById('p1');
  const c2 = document.getElementById('p2');
  let s1 = setup(c1);
  let s2 = setup(c2);

  window.addEventListener('resize', () => {
    s1 = setup(c1);
    s2 = setup(c2);
  });

  const t0 = performance.now();

  function drawWavephase(now) {
    const { ctx, w, h } = s1;
    const t = ((now - t0) / 1000) % 4.2;
    const k = (t / 4.2) * Math.PI * 2 + Math.PI;
    const amp = h * (0.055 + 0.2 * (0.5 - 0.5 * Math.cos(k)));

    const mid = h * 0.56;
    const lam = w * 0.8;
    const A0 = h * 0.14;
    const wave = (x) => mid - amp * Math.sin((2 * Math.PI * x) / lam);

    ctx.fillStyle = '#FBFAF6';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(26,34,46,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(20, mid);
    ctx.lineTo(w - 20, mid);
    ctx.stroke();

    [
      { x: lam * 0.25, y: mid - A0 },
      { x: lam * 0.75, y: mid + A0 },
    ].forEach((r) => {
      const lit = Math.abs(wave(r.x) - r.y) < 7;
      ctx.strokeStyle = lit ? RED : 'rgba(26,34,46,0.40)';
      ctx.lineWidth = lit ? 2.6 : 1.8;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 20, 0, Math.PI * 2);
      ctx.stroke();
      if (lit) {
        ctx.fillStyle = ACCENT;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    ctx.strokeStyle = RED;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const x = (w * i) / 200;
      const y = wave(x);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();

    const bx = ((t / 4.2) * w) % w;
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.arc(bx, wave(bx), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHarmonic(now) {
    const { ctx, w, h } = s2;
    const t = ((now - t0) / 1000) % 6;
    const settle = Math.min(1, Math.max(0, (t - 0.4) / 2.6));
    const miss = (1 - settle) * 0.9;

    ctx.fillStyle = '#FBFAF6';
    ctx.fillRect(0, 0, w, h);

    const N = 220;
    const amp = h * 0.22;
    const mid = h * 0.46;
    const x0 = 40, x1 = w - 40;

    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(26,34,46,0.28)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const x = x0 + (x1 - x0) * u;
      const y = mid - amp * (Math.sin(u * Math.PI * 4) + 0.45 * Math.sin(u * Math.PI * 8));
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const x = x0 + (x1 - x0) * u;
      const y = mid - amp * (Math.sin(u * Math.PI * 4 + miss) + 0.45 * Math.sin(u * Math.PI * 8));
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();

    const u = (t * 0.18) % 1;
    const px = x0 + (x1 - x0) * u;
    const py = mid - amp * (Math.sin(u * Math.PI * 4 + miss) + 0.45 * Math.sin(u * Math.PI * 8));
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop(now) {
    if (!stage.classList.contains('on')) {
      drawWavephase(now);
      drawHarmonic(now);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
