<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波形图集 · Swell</title>
<style>
  :root {
    --paper: #FBFAF6;
    --ink: #1A222E;
    --soft: #7A8290;
    --faint: #B4BAC4;
    --line: #E4E0D7;
    --red: #C0392B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 1520px; margin: 0 auto; padding: 56px 64px 80px; }

  header { margin-bottom: 40px; }
  .mark {
    font-family: "Gabriola", "French Script MT", "Segoe Script", cursive;
    font-size: 96px;
    line-height: 0.9;
    font-style: italic;
    color: var(--red);
    margin-left: -6px;
  }
  h1 { margin: 6px 0 0; font-size: 30px; font-weight: 600; letter-spacing: 0.06em; }
  .en { margin-top: 8px; font-size: 11px; letter-spacing: 0.34em; color: var(--faint); }
  .lead { margin-top: 14px; font-size: 14px; color: var(--soft); line-height: 1.85; }
  .lead code { font-family: Consolas, monospace; font-size: 13px; color: var(--ink); }

  .group {
    margin: 44px 0 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .group h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; }
  .group span { font-size: 12px; color: var(--faint); letter-spacing: 0.1em; }

  .row { margin-bottom: 22px; }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 3px; }
  .no { font-size: 12px; letter-spacing: 0.18em; color: var(--faint); }
  .name { font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .timbre { font-size: 12px; color: var(--soft); border: 1px solid var(--line);
            border-radius: 999px; padding: 2px 10px; }
  .formula {
    margin: 10px 0 4px;
    font-family: "Cambria Math", "Latin Modern Math", "STIX Two Math",
                 "Times New Roman", "Songti SC", serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 2.0;
    letter-spacing: 0.01em;
  }
  canvas { display: block; width: 100%; height: 212px; }

  footer { margin-top: 46px; padding-top: 16px; border-top: 1px solid var(--line);
           display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
  footer a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--red); }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="mark">f</div>
    <h1>波形图集</h1>
    <div class="en">A T L A S &nbsp; O F &nbsp; W A V E S</div>
    <p class="lead">
      横轴 <code>x ∈ [0, 2π]</code>，等于基频的一个完整周期（<code>u = x/2π ∈ [0,1]</code>）；纵轴为各分量正弦之和。<br>
      上半部分是《谐律》六关的目标波形与两个彩蛋，下半部分是六条经典波形，作为对照。<br>
      全部共用同一纵轴刻度，可以直接比较高度。
    </p>
  </header>

  <div id="rows"></div>

  <footer>
    <span>y(x) = Σ aᵢ · sin(fᵢ·x + φᵢ)</span>
    <span><a href="fourier.html">动态展柜 →</a> · Swell</span>
  </footer>
</div>

ata-c=\"2B\" xlink:href=\"#MJX-20-TEX-N-2B\"></use></g><g data-mml-node=\"mi\" transform=\"translate(11175.3,0)\"><use data-c=\"63\" xlink:href=\"#MJX-20-TEX-N-63\"></use><use data-c=\"6F\" xlink:href=\"#MJX-20-TEX-N-6F\" transform=\"translate(444,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-20-TEX-N-73\" transform=\"translate(944,0)\"></use></g><g data-mml-node=\"mo\" transform=\"translate(12513.3,0)\"><use data-c=\"2061\" xlink:href=\"#MJX-20-TEX-N-2061\"></use></g><g data-mml-node=\"mn\" transform=\"translate(12680,0)\"><use data-c=\"34\" xlink:href=\"#MJX-20-TEX-N-34\"></use></g><g data-mml-node=\"mi\" transform=\"translate(13180,0)\"><use data-c=\"1D465\" xlink:href=\"#MJX-20-TEX-I-1D465\"></use></g><g data-mml-node=\"mo\" transform=\"translate(13974.2,0)\"><use data-c=\"2B\" xlink:href=\"#MJX-20-TEX-N-2B\"></use></g><g data-mml-node=\"mi\" transform=\"translate(14974.4,0)\"><use data-c=\"63\" xlink:href=\"#MJX-20-TEX-N-63\"></use><use data-c=\"6F\" xlink:href=\"#MJX-20-TEX-N-6F\" transform=\"translate(444,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-20-TEX-N-73\" transform=\"translate(944,0)\"></use></g><g data-mml-node=\"mo\" transform=\"translate(16312.4,0)\"><use data-c=\"2061\" xlink:href=\"#MJX-20-TEX-N-2061\"></use></g><g data-mml-node=\"mn\" transform=\"translate(16479.1,0)\"><use data-c=\"35\" xlink:href=\"#MJX-20-TEX-N-35\"></use></g><g data-mml-node=\"mi\" transform=\"translate(16979.1,0)\"><use data-c=\"1D465\" xlink:href=\"#MJX-20-TEX-I-1D465\"></use></g><g data-mml-node=\"mo\" transform=\"translate(17773.3,0)\"><use data-c=\"2B\" xlink:href=\"#MJX-20-TEX-N-2B\"></use></g><g data-mml-node=\"mo\" transform=\"translate(18773.6,0)\"><use data-c=\"22EF\" xlink:href=\"#MJX-20-TEX-N-22EF\"></use></g><g data-mml-node=\"mo\" transform=\"translate(20167.8,0)\"><use data-c=\"2B\" xlink:href=\"#MJX-20-TEX-N-2B\"></use></g><g data-mml-node=\"mi\" transform=\"translate(21168,0)\"><use data-c=\"63\" xlink:href=\"#MJX-20-TEX-N-63\"></use><use data-c=\"6F\" xlink:href=\"#MJX-20-TEX-N-6F\" transform=\"translate(444,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-20-TEX-N-73\" transform=\"translate(944,0)\"></use></g><g data-mml-node=\"mo\" transform=\"translate(22506,0)\"><use data-c=\"2061\" xlink:href=\"#MJX-20-TEX-N-2061\"></use></g><g data-mml-node=\"mn\" transform=\"translate(22672.7,0)\"><use data-c=\"32\" xlink:href=\"#MJX-20-TEX-N-32\"></use><use data-c=\"30\" xlink:href=\"#MJX-20-TEX-N-30\" transform=\"translate(500,0)\"></use></g><g data-mml-node=\"mi\" transform=\"translate(23672.7,0)\"><use data-c=\"1D465\" xlink:href=\"#MJX-20-TEX-I-1D465\"></use></g><g data-mml-node=\"mo\" transform=\"translate(24244.7,0)\"><use data-c=\"5D\" xlink:href=\"#MJX-20-TEX-N-5D\"></use></g></g></g></g></svg></mjx-container>"];

// [频率倍数, 振幅, 相位]
const WAVES = [
  { group: 'levels', no: '01', name: '单音', timbre: '吉他',
    comps: [[1, 1.0, PI / 2]] },
  { group: 'levels', no: '02', name: '双音', timbre: '钢琴',
    comps: [[1, 1.0, 0], [2, 0.6, PI]] },
  { group: 'levels', no: '03', name: '和弦', timbre: '古筝',
    comps: [[1, 1.0, 0], [3, 1 / 3, 0], [5, 0.2, 0]] },
  { group: 'levels', no: '04', name: '拍音', timbre: '木琴',
    comps: [[4, 1.0, 0], [5, 1.0, 0]] },
  { group: 'levels', no: '05', name: '泛音', timbre: '钟',
    comps: [[1, 1.0, 0], [2, 0.5, 0], [4, 0.25, 0]] },
  { group: 'levels', no: '06', name: '全奏', timbre: '弦乐',
    comps: [[1, 1.0, 0], [2, 0.6, 0], [3, 0.4, 0], [4, 0.25, 0]] },
  { group: 'levels', no: '07', name: '潮', timbre: '彩蛋 · 弦乐',
    comps: [[1, 1.0, 0], [2, 0.5, 0], [3, 1 / 3, 0], [4, 0.25, 0]] },
  { group: 'levels', no: '08', name: '涟', timbre: '彩蛋 · 钟',
    comps: [[2, 1.0, 0], [4, 0.5, PI / 2], [6, 1 / 3, PI]] },

  // ------------------------------ 附录：经典波形
  // 级数展开到足够多项，形状才收敛
  { group: 'classic', no: 'A1', name: '方波', timbre: '奇次 1/n，取到 39 次',
    comps: (() => { const c = []; for (let k = 1; k <= 39; k += 2) c.push([k, 4 / PI / k, 0]); return c; })() },
  { group: 'classic', no: 'A2', name: '锯齿波', timbre: '全部 1/n，交替符号',
    comps: (() => { const c = []; for (let n = 1; n <= 40; n++) c.push([n, (2 / PI) * (n % 2 ? 1 : -1) / n, 0]); return c; })() },
  { group: 'classic', no: 'A3', name: '三角波', timbre: '奇次 1/n²，交替符号',
    comps: (() => { const c = []; let i = 0; for (let k = 1; k <= 39; k += 2) { c.push([k, (8 / PI / PI) * (i % 2 ? -1 : 1) / (k * k), 0]); i++; } return c; })() },
  { group: 'classic', no: 'A4', name: '半波整流', timbre: '含直流分量',
    dc: 1 / PI,
    comps: (() => { const c = [[1, 0.5, 0]]; for (let n = 1; n <= 8; n++) c.push([2 * n, -(2 / PI) / (4 * n * n - 1), PI / 2]); return c; })() },
  { group: 'classic', no: 'A5', name: '全波整流', timbre: '含直流分量',
    dc: 2 / PI,
    comps: (() => { const c = []; for (let n = 1; n <= 8; n++) c.push([2 * n, -(4 / PI) / (4 * n * n - 1), PI / 2]); return c; })() },
  { group: 'classic', no: 'A6', name: '窄脉冲', timbre: '20 条同相谐波',
    comps: (() => { const c = []; for (let n = 1; n <= 20; n++) c.push([n, 1 / 20, PI / 2]); return c; })() },];

const value = (w, x) =>
  (w.dc || 0) + w.comps.reduce((s, [f, a, p]) => s + a * Math.sin(f * x + p), 0);

// 统一纵轴：所有曲线的最大绝对值
let peak = 0;
WAVES.forEach((w) => {
  for (let i = 0; i <= 2400; i++) {
    peak = Math.max(peak, Math.abs(value(w, (i / 2400) * PI * 2)));
  }
});

const rows = document.getElementById('rows');
let lastGroup = '';

let wi = 0, ci = 0;
WAVES.forEach((w) => {
  if (w.group !== lastGroup) {
    lastGroup = w.group;
    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML = w.group === 'levels'
      ? '<h2>谐律 · 六关与彩蛋</h2><span>GAME LEVELS</span>'
      : '<h2>附录 · 经典波形</h2><span>CLASSIC WAVEFORMS</span>';
    rows.appendChild(g);
  }

  const row = document.createElement('section');
  row.className = 'row';
  row.innerHTML =
    '<div class="head">' +
      '<span class="no">' + w.no + '</span>' +
      '<span class="name">' + w.name + '</span>' +
      '<span class="timbre">' + w.timbre + '</span>' +
    '</div>' +
    '<div class="formula">' + MATH_SVG[wi++] + '</div>' +
    (w.group === 'classic' ? '<div class="formula second">' + MATH_SVG[14 + ci++] + '</div>' : '') +
    '<canvas></canvas>';
  rows.appendChild(row);

  const cv = row.querySelector('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = cv.getBoundingClientRect();
  const W = rect.width, H = 212;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const L = 58, R = 26, T = 20, B = 32;
  const x0 = L, x1 = W - R, yMid = T + (H - T - B) / 2;
  const unit = (H - T - B) / 2 / (peak * 1.06);

  const px = (x) => x0 + (x / (PI * 2)) * (x1 - x0);
  const py = (y) => yMid - y * unit;

  // 参考线
  ctx.strokeStyle = 'rgba(26,34,46,0.055)';
  ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const X = px((k * PI) / 2);
    ctx.beginPath(); ctx.moveTo(X, T); ctx.lineTo(X, H - B); ctx.stroke();
  }
  [1, 0.5, -0.5, -1].forEach((v) => {
    ctx.beginPath(); ctx.moveTo(x0, py(v)); ctx.lineTo(x1, py(v)); ctx.stroke();
  });

  // 坐标轴
  ctx.strokeStyle = 'rgba(26,34,46,0.42)';
  ctx.beginPath(); ctx.moveTo(x0, yMid); ctx.lineTo(x1 + 8, yMid); ctx.stroke();
  ctx.fillStyle = 'rgba(26,34,46,0.42)';
  ctx.beginPath(); ctx.moveTo(x1 + 8, yMid); ctx.lineTo(x1 + 1, yMid - 4); ctx.lineTo(x1 + 1, yMid + 4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0, H - B); ctx.lineTo(x0, T - 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, T - 8); ctx.lineTo(x0 - 4, T - 1); ctx.lineTo(x0 + 4, T - 1); ctx.closePath(); ctx.fill();

  // 刻度
  ctx.fillStyle = SOFT;
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  [['0', 0], ['π/2', PI / 2], ['π', PI], ['3π/2', 3 * PI / 2], ['2π', PI * 2]].forEach(([label, x]) => {
    const X = px(x);
    ctx.strokeStyle = 'rgba(26,34,46,0.35)';
    ctx.beginPath(); ctx.moveTo(X, yMid - 3); ctx.lineTo(X, yMid + 3); ctx.stroke();
    ctx.fillText(label, X, yMid + 8);
  });

  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  [['1', 1], ['−1', -1]].forEach(([label, v]) => {
    ctx.strokeStyle = 'rgba(26,34,46,0.35)';
    ctx.beginPath(); ctx.moveTo(x0 - 3, py(v)); ctx.lineTo(x0 + 3, py(v)); ctx.stroke();
    ctx.fillText(label, x0 - 8, py(v));
  });

  // 曲线
  ctx.strokeStyle = RED;
  ctx.lineWidth = 1.9;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  const N = 1600;
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * PI * 2;
    const X = px(x), Y = py(value(w, x));
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.stroke();
});
