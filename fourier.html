<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波形展柜 · Swell</title>
<style>
  :root {
    --paper: #FBFAF6; --ink: #1A222E; --soft: #6E7684; --faint: #A8AEB8;
    --line: #E4E0D7; --red: #C0392B; --wash: #F5F2EA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 1240px; margin: 0 auto; padding: 48px 56px 64px; }

  header { display: flex; align-items: flex-end; gap: 18px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .mark {
    font-family: "Gabriola", "French Script MT", "Segoe Script", cursive;
    font-size: 88px; line-height: .8; font-style: italic; color: var(--red); margin-left: -4px;
  }
  h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: .05em; }
  .en { margin-top: 7px; font-size: 10px; letter-spacing: .32em; color: var(--faint); }
  .lead { margin: 0 0 0 auto; max-width: 520px; font-size: 13px; line-height: 1.9; color: var(--soft); text-align: right; }
  .lead b { color: var(--ink); font-weight: 600; }
  .lead b.blue { color: #3A6EA5; }
  .lead b.red { color: var(--red); }
  .meta { margin-left: 28px; text-align: right; font-size: 11px; color: var(--faint); line-height: 1.9; white-space: nowrap; }
  .meta a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  .meta a:hover { color: var(--red); border-color: rgba(192,57,43,.4); }

  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0; margin-bottom: 22px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    font: inherit; font-size: 13px; color: var(--soft); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; transition: all .16s ease;
  }
  .tab b { font-weight: 500; font-size: 10px; opacity: .6; margin-left: 4px; }
  .tab:hover { border-color: rgba(192,57,43,.4); color: var(--ink); }
  .tab.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .tab.on b { opacity: .75; }
  .btn {
    margin-left: auto; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px;
    transition: all .16s ease;
  }
  .btn:hover { border-color: rgba(192,57,43,.45); color: var(--red); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .card {
    display: flex; flex-direction: column;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(26,34,46,.035);
  }
  .head { display: flex; align-items: baseline; gap: 9px; padding: 16px 20px 0; }
  .no { font-size: 10px; letter-spacing: .16em; color: var(--faint); }
  .head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .03em; }
  .head .en { margin: 0; font-size: 9px; letter-spacing: .22em; color: var(--faint); }
  .badge {
    margin-left: auto; font-size: 10px; letter-spacing: .1em; color: var(--red);
    border: 1px solid rgba(192,57,43,.28); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
  }
  .badge.fin { color: var(--soft); border-color: var(--line); }

  .canvas-wrap { padding: 8px 12px 0; }
  canvas { display: block; width: 100%; height: 300px; }

  .formula-wrap { padding: 10px 20px 0; }
  .formula {
    font-size: 19px; line-height: 1.55; min-height: 46px; color: var(--ink);
    overflow-x: auto; overflow-y: hidden;
  }
  .formula.second { font-size: 15px; color: var(--soft); min-height: 26px; margin-top: 6px; }
  .formula mjx-container { display: block !important; max-width: 100%; }
  .formula svg { display: block; max-width: 100%; height: auto; }
  mjx-assistive-mml {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .exact { font-size: 12px; color: var(--faint); letter-spacing: .06em; padding-top: 4px; }

  .note { margin: 12px 20px 0; font-size: 13.5px; line-height: 1.75; color: var(--soft); min-height: 48px; max-width: 960px; }
  .note b { color: var(--ink); font-weight: 600; }

  .foot {
    display: flex; align-items: center; gap: 10px;
    margin: auto 20px 0; padding: 10px 0 14px; border-top: 1px solid var(--line);
  }
  .count { font-size: 11px; color: var(--soft); letter-spacing: .04em; white-space: nowrap; }
  .count b { color: var(--ink); font-weight: 600; }
  .term { font-size: 11px; color: #3A6EA5; white-space: nowrap; }
  .prog { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--red); }
  .again {
    width: 26px; height: 26px; padding: 0; flex: none;
    border: 1px solid var(--line); border-radius: 50%; background: transparent;
    color: var(--soft); font-size: 14px; line-height: 1; cursor: pointer;
  }
  .again:hover { color: var(--red); border-color: rgba(192,57,43,.4); }
  .toggle {
    display: flex; align-items: center; gap: 6px; flex: none;
    font: inherit; font-size: 11px; color: var(--soft); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 9px; transition: all .16s ease;
  }
  .toggle i {
    display: block; position: relative; width: 15px; height: 8px; flex: none;
    border-radius: 999px; background: var(--line); transition: background .16s ease;
  }
  .toggle i::after {
    content: ""; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
    border-radius: 50%; background: #fff; border: 1px solid var(--line);
    transition: left .16s ease, border-color .16s ease;
  }
  .toggle.on { color: #3A6EA5; border-color: rgba(58,110,165,.35); }
  .toggle.on i { background: #3A6EA5; }
  .toggle.on i::after { left: 5px; border-color: #3A6EA5; }
  .toggle:hover { border-color: rgba(58,110,165,.5); }

  footer.page {
    margin-top: 42px; padding-top: 16px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 12px; color: var(--faint); line-height: 1.8;
  }
  footer.page a { color: var(--soft); text-decoration: none; }
  footer.page a:hover { color: var(--red); }

  @media (max-width: 820px) {
    .sheet { padding: 28px 18px 44px; }
    header { flex-wrap: wrap; gap: 10px; }
    .mark { font-size: 64px; }
    .lead { margin-left: 0; max-width: none; text-align: left; order: 3; flex-basis: 100%; }
    .meta { margin-left: auto; }
    .grid { grid-template-columns: 1fr; }
    canvas { height: 240px; }
    .formula { font-size: 16px; }
    .formula.second { font-size: 13px; }
    .bar { flex-wrap: wrap; }
    .term { display: none; }
    .toggle span { display: none; }
    .btn { margin-left: 0; }
  }
</style>
</head>

    f: (x) => Math.sign(Math.sin(x)),
    terms: series(61, (n) => (n % 2 ? [0, 4 / (PI * n)] : null)),
    formula: 0, formula2: 1,
  },
  {
    no: '02', id: 'saw', name: '锯齿', en: 'SAWTOOTH', group: 'classic',
    note: '全部谐波，系数 2/(πn)，正负交替。项数越多，红线越贴近虚线；两端的跳变永远有过冲。',
    f: (x) => x / PI,
    terms: series(40, (n) => [0, 2 * (n % 2 ? 1 : -1) / (PI * n)]),
    formula: 2, formula2: 3,
  },
  {
    no: '03', id: 'tri', name: '三角', en: 'TRIANGLE', group: 'classic',
    note: '只有奇次，系数 8/(π²n²)。1/n² 收敛快，31 项已经几乎重合；曲线本身是连续的。',
    f: (x) => (2 / PI) * Math.asin(Math.sin(x)),
    terms: series(61, (n) => {
      if (n % 2 === 0) return null;
      return [0, (8 / (PI * PI)) * ((n - 1) % 4 === 0 ? 1 : -1) / (n * n)];
    }),
    formula: 4, formula2: 5,
  },
  {
    no: '04', id: 'half', name: '半波整流', en: 'HALF-WAVE', group: 'classic',
    note: '含直流 1/π；偶次余弦按 1/(4n²−1) 衰减。0 和 π 处是折点，不是跳变。',
    f: (x) => Math.max(Math.sin(x), 0),
    terms: series(40, (n) => {
      if (n === 1) return [0, 0.5];
      if (n % 2 === 0) { const m = n / 2; return [-2 / (PI * (4 * m * m - 1)), 0]; }
      return null;
    }, 1 / PI),
    formula: 6, formula2: 7,
  },
  {
    no: '05', id: 'full', name: '全波整流', en: 'FULL-WAVE', group: 'classic',
    note: '含直流 2/π；只有偶次余弦。比半波更光滑，但谷底仍有折点。',
    f: (x) => Math.abs(Math.sin(x)),
    terms: series(40, (n) => {
      if (n % 2 === 0) { const m = n / 2; return [-4 / (PI * (4 * m * m - 1)), 0]; }
      return null;
    }, 2 / PI),
    formula: 8, formula2: 9,
  },
  {
    no: '06', id: 'pulse', name: '窄脉冲', en: 'PULSE', group: 'classic',
    note: '25% 占空比；系数 sin(nπ/4)/n。每第 4 次谐波正好为零（n = 4, 8, 12 …）。',
    f: (x) => (Math.abs(x) < PI / 4 ? 1 : 0),
    terms: series(40, (n) => [(2 / (PI * n)) * Math.sin(n * PI / 4), 0], 0.25),
    formula: 10, formula2: 11,
  },

  {
    no: '07', id: 'stair', name: '台阶', en: 'STAIRCASE', group: 'shape',
    note: '三级台阶。每第 3 次谐波为零（n = 3, 6, 9 …），40 次里只剩 27 项；跳变处仍有吉布斯。',
    f: (x) => (x < -PI / 3 ? -1 : x < PI / 3 ? 0 : 1),
    terms: series(40, (n) => [0, (2 / (PI * n)) * (Math.cos(n * PI / 3) - (n % 2 ? -1 : 1))]),
    formula: 12, formula2: 13,
  },
  {
    no: '08', id: 'parab', name: '抛物线', en: 'PARABOLA', group: 'shape',
    note: '偶函数，只有余弦，系数 1/n²。周期延拓后在 0 处接成一个尖点；30 项已经很像。',
    f: (x) => x * x / (PI * PI) - 1 / 3,
    terms: series(30, (n) => [4 * (n % 2 ? -1 : 1) / (PI * PI * n * n), 0]),
    formula: 14, formula2: 15,
  },
  {
    no: '09', id: 'absx', name: '绝对值', en: 'ABSOLUTE', group: 'shape',
    note: 'V 形，只有奇次余弦，系数 1/n²。0 处的尖点让收敛变慢。',
    f: (x) => 2 * Math.abs(x) / PI - 1,
    terms: series(61, (n) => (n % 2 ? [-8 / (PI * PI * n * n), 0] : null)),
    formula: 16, formula2: 17,
  },
  {
    no: '10', id: 'trap', name: '梯形', en: 'TRAPEZOID', group: 'shape',
    note: '平顶斜边；1/n²，每第 3 次谐波为零（31 次里只剩 21 项）。跳变变成折角，过冲小得多。',
    f: (x) => {
      const a = PI / 3, ax = Math.abs(x);
      if (ax <= a) return 3 * x / PI;
      if (ax <= 2 * a) return x > 0 ? 1 : -1;
      return (x > 0 ? 1 : -1) * 3 * (PI - ax) / PI;
    },
    terms: series(61, (n) => {
      if (n % 2 === 0) return null;
      return [0, (12 / (PI * PI)) * Math.sin(n * PI / 3) / (n * n)];
    }),
    formula: 18, formula2: 19,
  },
  {
    no: '11', id: 'missing', name: '缺失基频', en: 'MISSING', group: 'shape',
    note: '把方波的基频拿掉；中间塌下去，但耳朵仍会自己补出基频——如果有声音的话。',
    f: (x) => (PI / 4) * Math.sign(Math.sin(x)) - Math.sin(x),
    terms: series(61, (n) => (n % 2 && n >= 3 ? [0, 4 / (PI * n)] : null)),
    formula: 22, formula2: 23,
  },

  {
    no: '12', id: 'rc', name: 'RC 放电', en: 'DISCHARGE', group: 'lab',
    note: '每个周期从 1 指数掉到 ~0，再跳回 1；cos 和 sin 都有，系数按 1/n² 衰减。',
    f: (x) => Math.exp(-(x < 0 ? x + 2 * PI : x)),
    terms: series(30, (n) => [
      RC_C / (PI * (1 + n * n)),
      n * RC_C / (PI * (1 + n * n)),
    ], RC_C / (2 * PI)),
    formula: 20, formula2: 21,
  },
  {
    no: '13', id: 'fractal', name: '分形波', en: 'FRACTAL', group: 'lab', npts: 8192,
    note: '频率翻倍、振幅减半；画到第 9 层，虚线再多一层，越放大越毛糙。这张卡用 8192 点采样。',
    f: fractalShape,
    terms: fractalTerms,
    formula: 24, formula2: 25,
  },
  {
    no: '14', id: 'ecg', name: '心跳', en: 'HEARTBEAT', group: 'lab', badge: '设计谱',
    note: '24 条谐波逼近一个心跳；R 峰越尖，越需要更多项。手工谱，不是经典级数。',
    f: ecgShape,
    terms: ecgTerms,
    formula: 26, formula2: 27,
  },
];

const states = [];
const grid = document.getElementById('grid');
let resizeTimer = 0;

// 每条 f 都定义在 [-π, π]；画布是 [0, 4π]，所以统一做周期延拓。
WAVES.forEach((w) => {
  const raw = w.f;
  w.f = (x) => {
    const t = ((x + PI) % (2 * PI) + 2 * PI) % (2 * PI) - PI;
    return raw(t);
  };
});

function setupCanvas(st) {
  const cv = st.el.querySelector('canvas');
  const rect = cv.getBoundingClientRect();
  st.W = Math.max(320, rect.width || 560);
  st.H = Math.max(200, rect.height || 300);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(st.W * dpr);
  cv.height = Math.round(st.H * dpr);
  st.ctx = cv.getContext('2d');
  st.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function fullSum(st) {
  const out = new Float64Array(st.npts);
  for (const [n, a, b] of st.terms) {
    if (n === 0) { for (let i = 0; i < st.npts; i++) out[i] += a; continue; }
    for (let i = 0; i < st.npts; i++) out[i] += a * Math.cos(n * st.xs[i]) + b * Math.sin(n * st.xs[i]);
  }
  return out;
}

function computePeak(st) {
  const sum = fullSum(st);
  let p = 0;
  for (let i = 0; i < st.npts; i++) p = Math.max(p, Math.abs(sum[i]), Math.abs(st.f(st.xs[i])));
  for (const [n, a, b] of st.terms) p = Math.max(p, Math.hypot(a, b));
  return p * 1.06;
}

function draw(st) {
  const { ctx, W, H, peak } = st;
  if (!ctx) return;
  const L = 44, R = 16, T = 16, B = 30;
  const yMid = T + (H - T - B) / 2;
  const unit = (H - T - B) / 2 / peak;
  const px = (x) => L + (x / (4 * PI)) * (W - L - R);
  const py = (y) => yMid - y * unit;

  ctx.clearRect(0, 0, W, H);

  // 竖向网格
  ctx.strokeStyle = 'rgba(26,34,46,.055)';
  ctx.lineWidth = 1;
  for (let k = 0; k <= 8; k++) {
    const X = px((k * PI) / 2);
    ctx.beginPath(); ctx.moveTo(X, T); ctx.lineTo(X, H - B); ctx.stroke();
  }

  // ±1 参考线
  const half = (H - T - B) / 2;
  if (unit < half) {
    [1, -1].forEach((v) => {
      ctx.beginPath(); ctx.moveTo(L, py(v)); ctx.lineTo(W - R, py(v)); ctx.stroke();
    });
  }

  // 坐标轴
  ctx.strokeStyle = 'rgba(26,34,46,.42)';
  ctx.beginPath(); ctx.moveTo(L, yMid); ctx.lineTo(W - R + 7, yMid); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L, H - B); ctx.lineTo(L, T - 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(26,34,46,.22)';
  ctx.beginPath(); ctx.moveTo(L, H - B); ctx.lineTo(W - R, H - B); ctx.stroke();
  ctx.fillStyle = 'rgba(26,34,46,.42)';
  ctx.beginPath(); ctx.moveTo(W - R + 7, yMid); ctx.lineTo(W - R, yMid - 4); ctx.lineTo(W - R, yMid + 4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(L, T - 7); ctx.lineTo(L - 4, T); ctx.lineTo(L + 4, T); ctx.closePath(); ctx.fill();

  // 刻度
  ctx.fillStyle = '#7A8290';
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  [['0', 0], ['π', PI], ['2π', 2 * PI], ['3π', 3 * PI], ['4π', 4 * PI]].forEach(([label, x]) => {
    const X = px(x);
    ctx.strokeStyle = 'rgba(26,34,46,.35)';
    ctx.beginPath(); ctx.moveTo(X, H - B); ctx.lineTo(X, H - B + 4); ctx.stroke();
    ctx.fillText(label, X, H - 4);
  });
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  if (unit < half) {
    [['1', 1], ['−1', -1]].forEach(([label, v]) => {
      ctx.strokeStyle = 'rgba(26,34,46,.35)';
      ctx.beginPath(); ctx.moveTo(L - 3, py(v)); ctx.lineTo(L + 3, py(v)); ctx.stroke();
      ctx.fillText(label, L - 8, py(v));
    });
  }

  // 无穷项：虚线
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(122,130,144,.8)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let i = 0; i < st.npts; i++) {
    const X = px(st.xs[i]), Y = py(st.f(st.xs[i]));
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.stroke();
  ctx.restore();

  // 部分和：红线
  if (st.n > 0) {
    ctx.strokeStyle = '#C0392B';
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < st.npts; i++) {
      const X = px(st.xs[i]), Y = py(st.sum[i]);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }

  // 刚加的一项：蓝线，压在红线上，半透明
  if (st.n > 0 && st.showTerm) {
    const [tn, ta, tb] = st.terms[st.n - 1];
    ctx.strokeStyle = 'rgba(58,110,165,.8)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 0; i < st.npts; i++) {
      const y = tn === 0 ? ta : ta * Math.cos(tn * st.xs[i]) + tb * Math.sin(tn * st.xs[i]);
      const X = px(st.xs[i]), Y = py(y);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }

  st.countEl.innerHTML = `第 <b>${st.n}</b> / ${st.terms.length} 项`;
  st.progEl.style.width = `${(100 * st.n) / st.terms.length}%`;
  if (st.termEl) {
    if (st.n > 0) {
      const [tn, ta, tb] = st.terms[st.n - 1];
      const label = tn === 0 ? '直流' : (ta && tb ? `cos+sin ${tn}x` : ta ? `cos ${tn}x` : `sin ${tn}x`);
      st.termEl.textContent = '· 刚加：' + label;
    } else {
      st.termEl.textContent = '';
    }
  }
}

function addTerm(st) {
  const [n, a, b] = st.terms[st.n];
  if (n === 0) {
    for (let i = 0; i < st.npts; i++) st.sum[i] += a;
  } else {
    for (let i = 0; i < st.npts; i++) st.sum[i] += a * Math.cos(n * st.xs[i]) + b * Math.sin(n * st.xs[i]);
  }
  st.n++;
  draw(st);
  if (st.n >= st.terms.length) {
    st.playing = false;
    st.holdUntil = performance.now() + st.holdMs;
  }
}

function reset(st) {
  st.n = 0;
  st.sum.fill(0);
  st.playing = false;
  st.last = 0;
  st.holdUntil = 0;
  draw(st);
}

function start(st) {
  if (st.playing) return;
  if (st.n >= st.terms.length) reset(st);
  if (st.n === 0) addTerm(st);
  if (st.n >= st.terms.length) return;
  st.playing = true;
  st.last = 0;
  st.holdUntil = 0;
}

function tick(now) {
  for (const st of states) {
    if (st.el.style.display === 'none') continue;
    if (st.holdUntil && now >= st.holdUntil) {
      st.holdUntil = 0;
      reset(st);
      start(st);
      continue;
    }
    if (!st.playing) continue;
    if (!st.last) st.last = now;
    if (now - st.last >= st.stepMs) {
      st.last = now;
      addTerm(st);
    }
  }
  requestAnimationFrame(tick);
}

WAVES.forEach((w, index) => {
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.group = w.group;
  const badge = w.badge || '无穷';
  el.innerHTML =
    '<div class="head">' +
      `<span class="no">${w.no}</span>` +
      `<h2>${w.name}</h2>` +
      `<span class="en">${w.en}</span>` +
      `<span class="badge${badge === '无穷' ? '' : ' fin'}">${badge}</span>` +
    '</div>' +
    '<div class="canvas-wrap"><canvas role="img" aria-label="' + w.name + ' 的傅里叶级数"></canvas></div>' +
    '<div class="formula-wrap">' +
      '<div class="formula f1"></div>' +
      '<div class="formula second f2"></div>' +
    '</div>' +
    '<p class="note"></p>' +
    '<div class="foot">' +
      '<span class="count"></span>' +
      '<span class="term"></span>' +
      '<div class="prog"><i></i></div>' +
      '<button class="toggle on" aria-pressed="true" title="显示/隐藏刚加的那一项（蓝线）"><i></i><span>刚加项</span></button>' +
      '<button class="again" title="重播" aria-label="重播">↻</button>' +
    '</div>';
  grid.appendChild(el);

  const npts = w.npts || NPTS;
  const st = {
    ...w, el, index, npts,
    n: 0, playing: false, started: false, last: 0, holdUntil: 0, showTerm: true,
    xs: new Float64Array(npts),
    sum: new Float64Array(npts),
  };
  for (let i = 0; i < npts; i++) st.xs[i] = (i / (npts - 1)) * 4 * PI;

  el.querySelector('.f1').innerHTML = SVG[w.formula];
  const f2 = el.querySelector('.f2');
  if (w.formula2 != null) f2.innerHTML = SVG[w.formula2];
  el.querySelector('.note').textContent = w.note;

  st.countEl = el.querySelector('.count');
  st.termEl = el.querySelector('.term');
  st.progEl = el.querySelector('.prog i');
  st.stepMs = st.terms.length > 40 ? 90 : st.terms.length > 8 ? 150 : 420;
  st.holdMs = st.terms.length > 8 ? 1300 : 1800;

  setupCanvas(st);
  st.peak = computePeak(st);
  draw(st);
  states.push(st);

  el.querySelector('.again').addEventListener('click', () => {
    reset(st);
    start(st);
  });

  const toggle = el.querySelector('.toggle');
  toggle.addEventListener('click', () => {
    st.showTerm = !st.showTerm;
    toggle.classList.toggle('on', st.showTerm);
    toggle.setAttribute('aria-pressed', String(st.showTerm));
    if (st.termEl) st.termEl.style.display = st.showTerm ? '' : 'none';
    draw(st);
  });
  el._st = st;
});

const io = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (!entry.isIntersecting) return;
    const st = entry.target._st;
    if (!st || st.started) return;
    st.started = true;
    start(st);
  });
}, { threshold: 0.18 });

states.forEach((st) => io.observe(st.el));

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === tab));
  const g = tab.dataset.g;
  states.forEach((st) => {
    st.el.style.display = g === 'all' || st.group === g ? '' : 'none';
  });
  states.forEach((st) => {
    if (st.el.style.display !== 'none' && !st.started) {
      st.started = true;
      start(st);
    }
  });
});

document.getElementById('replayAll').addEventListener('click', () => {
  states.forEach((st) => {
    if (st.el.style.display === 'none') return;
    reset(st);
    st.started = true;
    start(st);
  });
});

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    states.forEach((st) => {
      if (st.el.style.display === 'none') return;
      setupCanvas(st);
      draw(st);
    });
  }, 140);
});

requestAnimationFrame(tick);
</script>
</body>
</html>
