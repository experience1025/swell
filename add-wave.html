<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加波 · Swell</title>
<style>
  :root {
    --paper: #FBFAF6; --ink: #1A222E; --soft: #7A8290; --faint: #B4BAC4;
    --line: #E4E0D7; --red: #C0392B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 1520px; margin: 0 auto; padding: 44px 64px 56px; }

  header { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 26px; }
  .mark {
    font-family: "Gabriola", "French Script MT", "Segoe Script", cursive;
    font-size: 76px; line-height: 0.85; font-style: italic;
    color: var(--red); margin-left: -4px;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.06em; }
  .en { margin-top: 6px; font-size: 10px; letter-spacing: 0.32em; color: var(--faint); }
  .lead { margin: 0 0 0 auto; max-width: 520px; font-size: 13px; line-height: 1.8; color: var(--soft); text-align: right; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab {
    font: inherit; font-size: 14px; color: var(--soft); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 16px; transition: all .18s ease;
  }
  .tab:hover { border-color: rgba(192,57,43,.4); color: var(--ink); }
  .tab.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .stage { position: relative; }
  canvas { display: block; width: 100%; height: 430px; }

  .formula {
    min-height: 92px;
    margin: 6px 0 2px;
    font-size: 20px;
    line-height: 1.4;
    color: var(--ink);
    display: block;
  }
  .formula svg { display: inline-block; vertical-align: middle; }
  .formula .eq { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 22px; margin-right: 4px; }

  .bar { display: flex; align-items: center; gap: 12px; margin-top: 10px;
         padding-top: 14px; border-top: 1px solid var(--line); }
  .btn {
    font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 18px; transition: all .16s ease;
  }
  .btn:hover { border-color: rgba(192,57,43,.45); color: var(--red); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); color: #fff; }
  .count { margin-left: auto; font-size: 13px; color: var(--soft); letter-spacing: 0.04em; }
  .count b { color: var(--ink); font-weight: 600; }

  footer { margin-top: 34px; display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
  footer a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--red); }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="mark">f</div>
    <div>
      <h1>加波</h1>
      <div class="en">A D D I N G &nbsp; W A V E S</div>
    </div>
    <p class="lead">
      一条曲线，一项一项加上去。<br>
      灰线是每个分量，朱红是它们的和；虚线是加到足够多项时的目标形状。
    </p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="formula" id="formula"></div>

  <div class="bar">
    <button class="btn primary" id="play">播放</button>
    <button class="btn" id="step">加一项</button>
    <button class="btn" id="reset">重来</button>
    <span class="count" id="count"></span>
  </div>

  <footer>
    <span>逐项叠加：y(x) = Σ aᵢ · sin(fᵢx + φᵢ)</span>
    <span><a href="fourier.html">动态展柜 →</a> · Swell</span>
  </footer>
</div>

=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mo\"><use data-c=\"2212\" xlink:href=\"#MJX-92-TEX-N-2212\"></use></g><g data-mml-node=\"mfrac\" transform=\"translate(778,0)\"><g data-mml-node=\"mn\" transform=\"translate(1005,676)\"><use data-c=\"32\" xlink:href=\"#MJX-92-TEX-N-32\"></use></g><g data-mml-node=\"mrow\" transform=\"translate(220,-686)\"><g data-mml-node=\"mn\"><use data-c=\"33\" xlink:href=\"#MJX-92-TEX-N-33\"></use><use data-c=\"39\" xlink:href=\"#MJX-92-TEX-N-39\" transform=\"translate(500,0)\"></use><use data-c=\"39\" xlink:href=\"#MJX-92-TEX-N-39\" transform=\"translate(1000,0)\"></use></g><g data-mml-node=\"mi\" transform=\"translate(1500,0)\"><use data-c=\"1D70B\" xlink:href=\"#MJX-92-TEX-I-1D70B\"></use></g></g><rect width=\"2270\" height=\"60\" x=\"120\" y=\"220\"></rect></g><g data-mml-node=\"mi\" transform=\"translate(3288,0)\"><use data-c=\"63\" xlink:href=\"#MJX-92-TEX-N-63\"></use><use data-c=\"6F\" xlink:href=\"#MJX-92-TEX-N-6F\" transform=\"translate(444,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-92-TEX-N-73\" transform=\"translate(944,0)\"></use></g><g data-mml-node=\"mo\" transform=\"translate(4626,0)\"><use data-c=\"2061\" xlink:href=\"#MJX-92-TEX-N-2061\"></use></g><g data-mml-node=\"mn\" transform=\"translate(4792.7,0)\"><use data-c=\"32\" xlink:href=\"#MJX-92-TEX-N-32\"></use><use data-c=\"30\" xlink:href=\"#MJX-92-TEX-N-30\" transform=\"translate(500,0)\"></use></g><g data-mml-node=\"mi\" transform=\"translate(5792.7,0)\"><use data-c=\"1D465\" xlink:href=\"#MJX-92-TEX-I-1D465\"></use></g></g></g></svg></mjx-container>"]};

const RED = '#C0392B', INK = '#1A222E', SOFT = '#7A8290', FAINT = '#B4BAC4';
const PI = Math.PI;

// 每个级数的：名字、单项、完整求和
const SERIES = {
  square: {
    label: '方波',
    term: (i) => { const k = 2 * i + 1; return { f: k, a: 4 / (PI * k), p: 0 }; },
    all: () => { const a = []; for (let k = 1; k <= 39; k += 2) a.push([k, 4 / (PI * k), 0]); return a; },
  },
  saw: {
    label: '锯齿波',
    term: (i) => ({ f: i + 1, a: (2 / PI) * (i % 2 ? -1 : 1) / (i + 1), p: 0 }),
    all: () => { const a = []; for (let n = 1; n <= 40; n++) a.push([n, (2 / PI) * (n % 2 ? 1 : -1) / n, 0]); return a; },
  },
  tri: {
    label: '三角波',
    term: (i) => { const k = 2 * i + 1; return { f: k, a: (8 / (PI * PI)) * (i % 2 ? -1 : 1) / (k * k), p: 0 }; },
    all: () => { const a = []; let j = 0; for (let k = 1; k <= 39; k += 2) { a.push([k, (8 / (PI * PI)) * (j % 2 ? -1 : 1) / (k * k), 0]); j++; } return a; },
  },
  half: {
    label: '半波整流',
    term: (i) => {
      if (i === 0) return { dc: 1 / PI };
      if (i === 1) return { f: 1, a: 0.5, p: 0 };
      const n = i - 1;
      return { f: 2 * n, a: -(2 / PI) / (4 * n * n - 1), p: PI / 2 };
    },
    all: () => { const a = [[0, 1 / PI, 0], [1, 0.5, 0]]; for (let n = 1; n <= 8; n++) a.push([2 * n, -(2 / PI) / (4 * n * n - 1), PI / 2]); return a; },
  },
  full: {
    label: '全波整流',
    term: (i) => {
      if (i === 0) return { dc: 2 / PI };
      const n = i;
      return { f: 2 * n, a: -(4 / PI) / (4 * n * n - 1), p: PI / 2 };
    },
    all: () => { const a = [[0, 2 / PI, 0]]; for (let n = 1; n <= 8; n++) a.push([2 * n, -(4 / PI) / (4 * n * n - 1), PI / 2]); return a; },
  },
  pulse: {
    label: '窄脉冲',
    term: (i) => ({ f: i + 1, a: 1 / 20, p: PI / 2 }),
    all: () => { const a = []; for (let n = 1; n <= 20; n++) a.push([n, 1 / 20, PI / 2]); return a; },
  },
};

const KEYS = Object.keys(SERIES);
const MAX_STEP = 12;

let key = 'square';
let n = 1;
let playing = false;
let timer = 0;

// 曲线求值：前 n 项的偏和
function partial(x, comps, upto) {
  let y = 0;
  for (let i = 0; i < upto; i++) {
    const t = comps[i];
    if (t.dc !== undefined) y += t.dc;
    else y += t.a * Math.sin(t.f * x + t.p);
  }
  return y;
}
function whole(x, list) {
  let y = 0;
  for (const [f, a, p] of list) y += (f === 0 ? a : a * Math.sin(f * x + p));
  return y;
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const tabsEl = document.getElementById('tabs');
const formulaEl = document.getElementById('formula');
const countEl = document.getElementById('count');

KEYS.forEach((k) => {
  const b = document.createElement('button');
  b.className = 'tab' + (k === key ? ' on' : '');
  b.textContent = SERIES[k].label;
  b.dataset.k = k;
  b.onclick = () => { key = k; n = 1; playing = false; timer = 0; sync(); };
  tabsEl.appendChild(b);
});

function terms() {
  const out = [];
  for (let i = 0; i < MAX_STEP; i++) out.push(SERIES[key].term(i));
  return out;
}

function sync() {
  [...tabsEl.children].forEach((b) => b.classList.toggle('on', b.dataset.k === key));
  document.getElementById('play').textContent = playing ? '暂停' : '播放';
  const list = terms();
  const names = SVG[key];
  let html = '<span class="eq">y =</span>';
  if (n <= 0) html += '<span class="eq">0</span>';
  else for (let i = 0; i < Math.min(n, names.length); i++) html += names[i];
  formulaEl.innerHTML = html;
  countEl.innerHTML = '第 <b>' + n + '</b> 项 / 共 <b>' + MAX_STEP + '</b> 项';
  draw();
}

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = cv.getBoundingClientRect();
  const W = rect.width, H = 430;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const L = 60, R = 30, T = 26, B = 40;
  const x0 = L, x1 = W - R, yMid = T + (H - T - B) / 2;

  const list = terms();
  const all = SERIES[key].all();
  let peak = 0;
  for (let i = 0; i <= 1200; i++) {
    const x = (i / 1200) * PI * 2;
    peak = Math.max(peak, Math.abs(whole(x, all)));
  }
  const unit = (H - T - B) / 2 / (peak * 1.12);
  const px = (x) => x0 + (x / (PI * 2)) * (x1 - x0);
  const py = (y) => yMid - y * unit;

  // 网格
  ctx.strokeStyle = 'rgba(26,34,46,0.055)';
  ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const X = px((k * PI) / 2);
    ctx.beginPath(); ctx.moveTo(X, T); ctx.lineTo(X, H - B); ctx.stroke();
  }
  [1, 0.5, -0.5, -1].forEach((v) => {
    ctx.beginPath(); ctx.moveTo(x0, py(v)); ctx.lineTo(x1, py(v)); ctx.stroke();
  });

  // 轴
  ctx.strokeStyle = 'rgba(26,34,46,0.42)';
  ctx.beginPath(); ctx.moveTo(x0, yMid); ctx.lineTo(x1 + 8, yMid); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, H - B); ctx.lineTo(x0, T - 8); ctx.stroke();
  ctx.fillStyle = 'rgba(26,34,46,0.42)';
  ctx.beginPath(); ctx.moveTo(x1 + 8, yMid); ctx.lineTo(x1 + 1, yMid - 4); ctx.lineTo(x1 + 1, yMid + 4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0, T - 8); ctx.lineTo(x0 - 4, T - 1); ctx.lineTo(x0 + 4, T - 1); ctx.closePath(); ctx.fill();

  ctx.fillStyle = SOFT;
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [['0', 0], ['π/2', PI / 2], ['π', PI], ['3π/2', 3 * PI / 2], ['2π', PI * 2]].forEach(([lab, x]) => {
    ctx.fillText(lab, px(x), yMid + 9);
  });
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  [['1', 1], ['−1', -1]].forEach(([lab, v]) => ctx.fillText(lab, x0 - 9, py(v)));

  const N = 1600;
  // 目标（完整级数）
  ctx.save();
  ctx.setLineDash([5, 7]);
  ctx.strokeStyle = 'rgba(122,130,144,0.7)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * PI * 2;
    const X = px(x), Y = py(whole(x, all));
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.stroke();
  ctx.restore();

  // 已加入的分量
  for (let i = 0; i < n; i++) {
    const t = list[i];
    if (t.dc !== undefined) continue;
    ctx.strokeStyle = 'rgba(26,34,46,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let j = 0; j <= N; j++) {
      const x = (j / N) * PI * 2;
      const y = t.a * Math.sin(t.f * x + t.p);
      const X = px(x), Y = py(y);
      j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }

  // 偏和
  ctx.strokeStyle = RED;
  ctx.lineWidth = 2.2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * PI * 2;
    const X = px(x), Y = py(partial(x, list, n));
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.stroke();

  // 最新一项单独标出
  if (n > 0) {
    const t = list[n - 1];
    if (t.dc === undefined) {
      ctx.save();
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = 'rgba(192,57,43,0.35)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (let j = 0; j <= N; j++) {
        const x = (j / N) * PI * 2;
        const y = t.a * Math.sin(t.f * x + t.p);
        const X = px(x), Y = py(y);
        j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }
}

function tick(now) {
  if (playing) {
    if (!timer) timer = now;
    if (now - timer > 1050) {
      timer = now;
      if (n < MAX_STEP) { n++; sync(); }
      else { playing = false; sync(); }
    }
  }
  requestAnimationFrame(tick);
}

document.getElementById('play').onclick = () => {
  if (n >= MAX_STEP) { n = 1; sync(); }
  playing = !playing;
  timer = 0;
  sync();
};
document.getElementById('step').onclick = () => {
  playing = false;
  if (n < MAX_STEP) n++;
  sync();
};
document.getElementById('reset').onclick = () => {
  playing = false; n = 1; timer = 0; sync();
};
