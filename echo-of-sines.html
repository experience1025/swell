<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo of Sines · Swell</title>
<style>
  :root {
    --paper: #FBFAF6;
    --ink: #1A222E;
    --soft: #626A77;
    --faint: #9AA1AC;
    --line: #E4E0D7;
    --grid: #EFEAE0;
    --axis: #D6D0C4;
    --red: #C0392B;
    --blue: #3A6EA5;
    --umber: #8A6A4F;
    --wash: #F5F2EA;
    --beige: #B7A489;
    --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    --math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
    --s: 1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { overflow: hidden; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  ::selection { background: rgba(192,57,43,.16); }

  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1600px; height: 900px;
    padding: 34px 56px 24px;
    transform: translate(-50%, -50%) scale(var(--s));
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  /* ---------- header ---------- */
  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--line);
  }
  .mark {
    font-family: "Gabriola", "French Script MT", "Segoe Script", cursive;
    font-style: italic;
    font-size: 96px;
    line-height: .74;
    color: var(--red);
    margin-left: -3px;
    margin-top: -9px;
    user-select: none;
  }
  .wordmark {
    flex: none;
    margin: 0;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
    font-size: 44px;
    line-height: 1;
    font-weight: 400;
    font-style: italic;
    letter-spacing: .015em;
    color: var(--red);
    white-space: nowrap;
  }

  /* ---------- tabs ---------- */
  .tabs {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 0 28px;
    align-self: center;
  }
  .tab {
    position: relative;
    display: block;
    text-align: left;
    padding: 9px 15px 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    overflow: hidden;
  }
  .tab .k {
    display: block;
    font-size: 10px;
    line-height: 1.2;
    letter-spacing: .24em;
    color: rgba(183,164,137,.62);
  }
  .tab .t {
    display: block;
    margin-top: 2px;
    font-size: 20px;
    line-height: 1.22;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--beige);
  }
  .tab .s {
    display: block;
    margin-top: 1px;
    font-size: 13px;
    line-height: 1.25;
    color: rgba(183,164,137,.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab::after {
    content: "";
    position: absolute;
    right: 13px; top: 13px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    opacity: 0;
    transition: opacity .18s ease;
  }
  .tab:hover:not(.on) {
    transform: translateY(-2px);
    border-color: rgba(192,57,43,.35);
    box-shadow: 0 8px 18px rgba(26,34,46,.05);
  }
  .tab.on {
    background: var(--red);
    border-color: var(--red);
    color: var(--paper);
    box-shadow: 0 10px 24px rgba(192,57,43,.18);
  }
  .tab.on .k, .tab.on .s { color: rgba(251,250,246,.68); }
  .tab.on .t { color: var(--paper); }
  .tab.on::after { background: var(--paper); opacity: 1; }
  .tab:focus-visible, .btn:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  /* ---------- scenes ---------- */
  .scenes { position: relative; flex: 1; min-height: 0; padding-top: 8px; }
  .scene { position: relative; display: none; height: 100%; min-height: 0; }
  .scene.on {
    display: grid;
    grid-template-columns: 440px minmax(0, 1fr);
    gap: 42px;
    animation: sceneIn .34s ease both;
  }
  @keyframes sceneIn {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #s1.on { display: block; }
  .merge {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) 140px;
    gap: 18px 24px;
  }
  .mcard {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 10px 28px rgba(26,34,46,.05);
    overflow: hidden;
  }
  .mctrl-card {
    display: grid;
    align-items: center;
    min-width: 0;
    min-height: 0;
    padding: 10px 16px;
    background: #FAF8F2;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 8px 22px rgba(26,34,46,.035);
    overflow: hidden;
  }
  .mhead { flex: none; height: 52px; display: flex; align-items: center; padding: 0 2px; }
  .mformula {
    font-family: var(--math);
    font-size: 46px;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: .005em;
    white-space: nowrap;
  }
  .mformula.right { font-size: 38px; }
  .mformula .fn { font-style: normal; }
  .mformula i { font-style: italic; }
  .mcanvas { position: relative; flex: 1; min-height: 0; }
  .mcanvas canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: #fff;
    border-radius: 10px;
    touch-action: none;
  }
  .mgroup { min-width: 0; }
  .mgroup.mleft { display: grid; grid-template-columns: 1fr 1fr auto; gap: 18px; align-items: end; }
  .mgroup.mright { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: end; }
  .mctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .mlab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .mlab .msym { font-family: var(--math); font-size: 23px; line-height: 1.1; color: var(--ink); }
  .mlab b { font-family: var(--math); font-size: 22px; line-height: 1.1; font-weight: 400; color: var(--ink); }
  .mplay {
    height: 48px;
    padding: 0 20px;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--paper);
    background: var(--red);
    border: 1px solid var(--red);
    border-radius: 10px;
    cursor: pointer;
    align-self: end;
    transition: background .15s ease;
  }
  .mplay:hover { background: #A93226; }
  .mctl input[type=range] {
    width: 100%; height: 24px; margin: 0; padding: 0;
    background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .mctl input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--c, var(--red)) 0 var(--p, 0%), var(--line) var(--p, 0%) 100%);
  }
  .mctl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
    background: var(--c, var(--red)); border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--c, var(--red));
  }
  .mctl input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .mctl input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--c, var(--red)); }
  .mctl input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--c, var(--red)); border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--c, var(--red));
  }

  .copy {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--faint);
  }
  .eyebrow b { color: var(--red); font-weight: 600; letter-spacing: .1em; }
  h2 {
    margin: 12px 0 0;
    font-size: 42px;
    line-height: 1.18;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .lede {
    margin: 14px 0 0;
    font-size: 19px;
    line-height: 1.74;
    color: var(--soft);
    letter-spacing: .01em;
  }
  .lede b { color: var(--ink); font-weight: 600; }

  .formula-block {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    min-width: 0;
  }
  .flabel {
    font-size: 10px;
    letter-spacing: .22em;
    color: var(--faint);
    margin-bottom: 5px;
  }
  .fhead {
    font-family: var(--math);
    font-size: 20px;
    line-height: 1.3;
    color: var(--soft);
    margin-bottom: 3px;
  }
  .formula {
    font-family: var(--math);
    font-size: 36px;
    line-height: 1.45;
    color: var(--ink);
    letter-spacing: .005em;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .formula.numeric { font-size: 28px; }
  .formula.small { font-size: 25px; line-height: 1.6; }
  .formula.synth { font-size: 34px; line-height: 1.7; color: var(--ink); }
  .formula.tiny { font-size: 19px; line-height: 1.7; color: var(--soft); margin-top: 5px; }
  .formula i { font-style: italic; }
  .formula .fn { font-style: normal; }
  .formula sub, .formula sup { font-size: .52em; line-height: 0; }
  .formula .frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    font-size: .8em;
    line-height: 1.06;
    margin: 0 .06em;
    transform: translateY(.1em);
  }
  .formula .frac .num { padding: 0 .14em .04em; border-bottom: 1.3px solid currentColor; }
  .formula .frac .den { padding: .04em .14em 0; }
  .formula .bracket { color: var(--soft); font-size: 1.08em; }
  .formula .last { color: var(--blue); }
  .formula .hot { color: var(--red); }
  .formula .term { display: inline-block; white-space: nowrap; }
  .formula .dim { color: var(--faint); }
  .formula .c-a { color: var(--red); }
  .formula .c-w { color: var(--blue); }
  .formula .c-p { color: var(--umber); }
  .c-a { color: var(--red); }
  .c-w { color: var(--blue); }
  .c-p { color: var(--umber); }
  .formula .sum {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin: 0 .08em;
  }
  .formula .sum .sig {
    font-size: 1.5em;
    line-height: .8;
    font-family: var(--math);
  }
  .formula .sum .lim {
    display: flex;
    flex-direction: column;
    font-size: .52em;
    line-height: 1.08;
    margin-left: .03em;
    text-align: left;
  }

  .readout {
    margin-top: 14px;
    padding-top: 11px;
    border-top: 1px dashed var(--line);
    display: flex;
    align-items: flex-end;
    gap: 30px;
  }
  .readout .item { display: flex; flex-direction: column; gap: 2px; }
  .readout .k {
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: .1em;
    color: var(--faint);
    white-space: nowrap;
  }
  .readout .v {
    font-family: var(--math);
    font-size: 25px;
    line-height: 1.05;
    color: var(--ink);
  }
  .readout .v.red { color: var(--red); }
  .readout .v.blue { color: var(--blue); }
  .readout .v.umber { color: var(--umber); }
  .readout .v.text { font-family: var(--sans); font-size: 20px; line-height: 1.3; letter-spacing: .02em; }
  .readout .u { font-size: 11px; color: var(--faint); letter-spacing: .06em; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 13px;
    font-size: 14px;
    line-height: 1.3;
    color: var(--soft);
    letter-spacing: .02em;
  }
  .status::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    flex: none;
  }
  .status.blue::before { background: var(--blue); }
  .status.umber::before { background: var(--umber); }

  .controls {
    margin-top: auto;
    padding-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sliders { display: flex; flex-direction: column; gap: 6px; }
  .slider-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 10px;
    row-gap: 1px;
  }
  .slider-row .slab {
    font-size: 14px;
    line-height: 1.2;
    color: var(--ink);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .slider-row .slab .sym {
    font-family: var(--math);
    font-style: italic;
    font-size: 16px;
    margin-right: 3px;
  }
  .slider-row .slab .sym.a { color: var(--red); }
  .slider-row .slab .sym.w { color: var(--blue); }
  .slider-row .slab .sym.p { color: var(--umber); }
  .slider-row .sval {
    font-family: var(--math);
    font-size: 17px;
    line-height: 1.2;
    color: var(--ink);
    text-align: right;
    white-space: nowrap;
  }
  .slider-row input[type=range] {
    grid-column: 1 / -1;
    width: 100%;
    height: 19px;
    margin: 0;
    padding: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  .slider-row input[type=range]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--c, var(--red)) 0 var(--p, 0%), var(--line) var(--p, 0%) 100%);
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 15px; height: 15px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--c, var(--red));
    border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--c, var(--red));
  }
  .slider-row input[type=range]::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  .slider-row input[type=range]::-moz-range-progress {
    height: 3px;
    border-radius: 2px;
    background: var(--c, var(--red));
  }
  .slider-row input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--c, var(--red));
    border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--c, var(--red));
  }
  .r-a { --c: var(--red); }
  .r-w { --c: var(--blue); }
  .r-p { --c: var(--umber); }

  .row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .btn {
    font-size: 14px;
    line-height: 1.2;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 14px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease, transform .15s ease;
    white-space: nowrap;
  }
  .btn:hover { color: var(--red); border-color: rgba(192,57,43,.42); }
  .btn:active { transform: translateY(1px); }
  .btn.ink { background: var(--red); border-color: var(--red); color: var(--paper); }
  .btn.ink:hover { background: #A93226; border-color: #A93226; color: #fff; }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  .chip {
    font-size: 13px;
    line-height: 1.2;
    color: var(--soft);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 11px;
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: rgba(192,57,43,.35); }
  .chip.on { background: var(--red); border-color: var(--red); color: var(--paper); }
  .chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .seg { display: flex; align-items: center; gap: 5px; margin-left: 2px; }
  .seg-label { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .seg .chip { padding: 4px 9px; font-size: 12px; }
  .hintline { font-size: 12px; color: var(--faint); letter-spacing: .02em; }
  .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--faint);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .shapes { margin-top: 14px; }
  #epShapes { margin-top: 0; }
  .shapes .chip { padding: 5px 11px; font-size: 13px; }
  .exp { margin-top: 5px; }
  .aside {
    margin-top: 15px;
    padding-left: 11px;
    border-left: 2px solid rgba(192,57,43,.35);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--soft);
    max-width: 440px;
  }
  .aside b { color: var(--ink); font-weight: 600; }
  #s4, #s6 { grid-template-columns: 500px minmax(0, 1fr); gap: 38px; }
  #s4 { grid-template-columns: 620px minmax(0, 1fr); gap: 34px; }
  #s5 { grid-template-columns: 560px minmax(0, 1fr); gap: 34px; }

  #s5.on { display: block; }
  .fo-card {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 14px 22px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 12px 34px rgba(26,34,46,.055);
    overflow: hidden;
  }
  .fo-head { flex: none; height: 32px; display: flex; align-items: center; gap: 10px; }
  .fo-no {
    display: inline-flex; align-items: center; justify-content: center;
    height: 20px; line-height: 1; padding: 0 6px;
    font-size: 12px; letter-spacing: .12em; color: #fff; font-weight: 600;
    border: 1px solid var(--red); border-radius: 6px;
    background: var(--red);
  }
  .fo-head h2 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: .03em; }
  .fo-en { font-size: 9px; letter-spacing: .24em; color: var(--faint); }
  .fo-badge {
    font-size: 10px; letter-spacing: .08em; color: var(--red);
    border: 1px solid rgba(192,57,43,.28); border-radius: 999px;
    padding: 3px 9px; white-space: nowrap;
  }
  .fo-badge.fin { color: var(--soft); border-color: var(--line); }
  .fo-page { margin-left: auto; font-size: 11px; letter-spacing: .08em; color: var(--faint); }
  .fo-canvas-wrap { position: relative; flex: 1; min-height: 0; margin-top: 6px; }
  .fo-canvas-wrap canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: #fff;
    border-radius: 10px;
    touch-action: none;
  }
  .fo-formula-wrap {
    flex: none; padding: 6px 2px 0; min-height: 92px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 4px 58px;
  }
  .fo-formula { font-size: 19px; line-height: 1.5; color: var(--ink); min-height: 36px; overflow: hidden; }
  .fo-formula.second { font-size: 15px; color: var(--ink); min-height: 24px; margin-top: 0; }
  .fo-formula svg { display: block; max-width: 100%; height: auto; }
  .fo-formula.draw { font-size: 26px; line-height: 1.62; min-height: 0; overflow: visible; }
  .fo-note {
    flex: none; margin: 6px 2px 0; height: 34px;
    font-size: 12.5px; line-height: 1.55; color: var(--soft);
    overflow: hidden;
  }
  .fo-foot {
    flex: none; height: 34px;
    display: flex; align-items: center; gap: 10px;
    padding-top: 8px; margin-top: 6px;
    border-top: 1px solid var(--line);
    padding-right: 118px;
  }
  .fo-count { font-size: 11px; color: var(--soft); letter-spacing: .04em; white-space: nowrap; }
  .fo-count b { color: var(--ink); font-weight: 600; }
  .fo-term { font-size: 10px; color: #3A6EA5; white-space: nowrap; }
  .fo-prog { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .fo-prog i { display: block; height: 100%; width: 0; background: var(--red); }
  .fo-toggle {
    display: flex; align-items: center; gap: 6px; flex: none;
    font: inherit; font-size: 11px; color: var(--soft); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 9px; transition: all .16s ease;

  function ln(ctx, x1, y1, x2, y2, color, width, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width || 1;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function txt(ctx, str, x, y, o) {
    o = o || {};
    ctx.save();
    ctx.fillStyle = o.color || C.soft;
    var fam = o.math ? '"Cambria Math","STIX Two Math","Times New Roman",serif'
                     : '"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
    ctx.font = (o.italic ? "italic " : "") + (o.weight || 500) + " " + (o.size || 16) + "px " + fam;
    ctx.textAlign = o.align || "left";
    ctx.textBaseline = o.base || "middle";
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function dot(ctx, x, y, r, color, halo) {
    if (halo) {
      ctx.save();
      ctx.fillStyle = C.paper;
      ctx.beginPath();
      ctx.arc(x, y, r + 3.5, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function view(w, h, pad, xmin, xmax, ymin, ymax) {
    var l = pad.l == null ? 54 : pad.l;
    var r = pad.r == null ? 36 : pad.r;
    var t = pad.t == null ? 32 : pad.t;
    var b = pad.b == null ? 42 : pad.b;
    var x0 = l, x1 = w - r, y0 = h - b, y1 = t;
    return {
      x0: x0, x1: x1, y0: y0, y1: y1,
      xmin: xmin, xmax: xmax, ymin: ymin, ymax: ymax,
      px: function (x) { return x0 + (x - xmin) / (xmax - xmin) * (x1 - x0); },
      py: function (y) { return y0 - (y - ymin) / (ymax - ymin) * (y0 - y1); }
    };
  }

  function drawGrid(v, xs, ys) {

    for (i = 0; i < xs.length; i++) {
      ln(v.ctx || v._ctx, v.px(xs[i]), v.y1, v.px(xs[i]), v.y0, C.grid, 1, [2, 6]);
    }
    for (i = 0; i < ys.length; i++) {

  }

  function axes(v, xs, ys, xlabels, ylabels) {

    ln(ctx, v.x0, v.y0, v.x0, v.y1, C.axis, 1.1);
    var i;
    for (i = 0; i < xs.length; i++) {
      txt(ctx, xlabels[i], v.px(xs[i]), v.y0 + 21, { math: true, size: 18, color: C.faint, align: "center" });
    }
    for (i = 0; i < ys.length; i++) {
      if (ylabels[i] === "") continue;
      txt(ctx, ylabels[i], v.x0 - 11, v.py(ys[i]), { math: true, size: 17, color: C.faint, align: "right" });
    }
  }

  function plot(ctx, v, fn, color, width, dash, steps) {
    steps = steps || 900;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width || 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= steps; i++) {
      var x = v.xmin + (v.xmax - v.xmin) * i / steps;
      var y = fn(x);
      if (!isFinite(y)) { started = false; continue; }
      var px = v.px(x), py = v.py(y);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  function legend(ctx, x, y, items) {
    var yy = y;
    for (var i = 0; i < items.length; i++) {

  function pos(cv, e) {

  function show(i, silent) {
    if (i < 0) i = 0;
    if (i > 3) i = 3;
    if (i === active && Scenes[i] && Scenes[i].ctx) return;

const PI = Math.PI;

const series = (maxN, coef, dc = 0) => {
  const out = [];
  if (dc) out.push([0, dc, 0]);
  for (let n = 1; n <= maxN; n++) {
    const v = coef(n);
    if (!v) continue;
    const [a, b] = v;
    if (Math.abs(a) > 1e-12 || Math.abs(b) > 1e-12) out.push([n, a, b]);
  }
  return out;
};

      ctx.restore();

      /* current value + horizontal guide */
      var tip = dc;
      for (m = 0; m < arr.length; m++) {
        tip += arr[m].R * Math.sin(arr[m].k * winX + arr[m].phi);
      }
      var dx = xOf(winX);
      var dy = yOf(tip);
      ln(ctx, px, py, dx, py, "rgba(192,57,43,.30)", 1.1, [4, 6]);
      dot(ctx, dx, dy, 4.0, C.red, true);
    }
  };

  /* ---------------- 05 : epicycles ---------------- */

  var EP_M = 256, EP_K = 24;

  function epResample(points, M) {
    if (!points || points.length < 3) return [];
    var pts = points.concat([{ x: points[0].x, y: points[0].y }]);
    var cum = [0], i;
    for (i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    }
    var total = cum[cum.length - 1];
    if (total < 1) return [];
    var out = [], seg = 1;
    for (i = 0; i < M; i++) {
      var target = total * i / M;
      while (seg < cum.length - 1 && cum[seg] < target) seg++;
      var t0 = cum[seg - 1], t1 = cum[seg];
      var f = t1 > t0 ? (target - t0) / (t1 - t0) : 0;
      out.push({
        x: pts[seg - 1].x + (pts[seg].x - pts[seg - 1].x) * f,
        y: pts[seg - 1].y + (pts[seg].y - pts[seg - 1].y) * f
      });
    }
    return out;
  }

  function epNormalize(raw, cx, cy, S) {
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (var i = 0; i < raw.length; i++) {
      var p = raw[i];
      if (p.x < minx) minx = p.x;
      if (p.x > maxx) maxx = p.x;
      if (p.y < miny) miny = p.y;
      if (p.y > maxy) maxy = p.y;
    }
    var w = maxx - minx, h = maxy - miny;
    var scale = (2 * S) / Math.max(w, h, 1);
    var ox = (minx + maxx) / 2, oy = (miny + maxy) / 2;
    return raw.map(function (q) {
      return { x: cx + (q.x - ox) * scale, y: cy + (q.y - oy) * scale };
    });
  }

  function epHeart(w, h) {
    var raw = [];
    for (var i = 0; i < 400; i++) {
      var t = TAU * i / 400;
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      raw.push({ x: x, y: -y });
    }
    return epNormalize(raw, w * 0.5, h * 0.5, Math.min(w, h) * 0.235);
  }

  function epStar(w, h) {
    var outer = 1, inner = 0.42;
    var verts = [];
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var r = i % 2 === 0 ? outer : inner;
      verts.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
    }
    verts.push(verts[0]);
    var raw = [];
    for (var j = 0; j < 400; j++) {
      var t = j / 400 * 10;
      var seg = Math.min(9, Math.floor(t));
      var f = t - seg;
      raw.push({
        x: verts[seg].x + (verts[seg + 1].x - verts[seg].x) * f,
        y: verts[seg].y + (verts[seg + 1].y - verts[seg].y) * f
      });
    }
    return epNormalize(raw, w * 0.5, h * 0.5, Math.min(w, h) * 0.245);
  }

  function epWave(w, h) {
    var raw = [];
    for (var i = 0; i < 400; i++) {
      var t = TAU * i / 400;
      var r = 0.78 + 0.16 * Math.cos(5 * t);
      raw.push({ x: r * Math.cos(t), y: 0.9 * r * Math.sin(t) });
    }
    return epNormalize(raw, w * 0.5, h * 0.5, Math.min(w, h) * 0.245);
  }

  function epCoefficients(pts) {
    var M = pts.length, i;
    var dcx = 0, dcy = 0;
    for (i = 0; i < M; i++) { dcx += pts[i].x; dcy += pts[i].y; }
    dcx /= M; dcy /= M;
    var arr = [];
    for (var k = -EP_K; k <= EP_K; k++) {
      if (k === 0) continue;
      var re = 0, im = 0;
      for (i = 0; i < M; i++) {
        var a = k * TAU * i / M;
        var c = Math.cos(a), s = Math.sin(a);
        re += pts[i].x * c + pts[i].y * s;
        im += pts[i].y * c - pts[i].x * s;
      }
      re /= M; im /= M;
      arr.push({ k: k, R: Math.hypot(re, im), phi: Math.atan2(im, re) });
    }
    arr.sort(function (p, q) { return q.R - p.R; });
    return { dc: { x: dcx, y: dcy }, coef: arr };
  }

    var r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (cv.clientWidth / Math.max(1, r.width)),
      y: (e.clientY - r.top) * (cv.clientHeight / Math.max(1, r.height))
    };
  }



  /* ---------------- fitting maths ---------------- */

  function analyze(y, K) {
    var a0 = 0, i, n;
    for (i = 0; i < M; i++) a0 += y[i];
    a0 /= M;
    var out = [];
    for (n = 1; n <= K; n++) {
      var re = 0, im = 0;
      for (i = 0; i < M; i++) {
        var th = TAU * n * i / M;
        re += y[i] * Math.cos(th);
        im += y[i] * Math.sin(th);
      }
      var a = 2 * re / M, b = 2 * im / M;
      out.push({ n: n, a: a, b: b, R: Math.hypot(a, b), phi: Math.atan2(a, b) });
    }
    return { a0: a0, terms: out };
  }

  function termCurve(t) {
    var arr = new Float64Array(M);
    for (var i = 0; i < M; i++) arr[i] = t.R * Math.sin(TAU * t.n * i / M + t.phi);
    return arr;
  }

  function r2(target, approx) {
    var se = 0, st = 0;
    for (var i = 0; i < M; i++) {
      var e = target[i] - approx[i];
      se += e * e;
      st += target[i] * target[i];
    }
    return st > 1e-9 ? 1 - se / st : 1;
  }

  var CLASSES = [
    { name: "正弦", f: function (t) { return Math.sin(TAU * t); } },
    { name: "方波", f: function (t) { return Math.sin(TAU * t) >= 0 ? 1 : -1; } },
    { name: "三角", f: function (t) { return (2 / Math.PI) * Math.asin(Math.sin(TAU * t)); } },
    { name: "锯齿", f: function (t) { return 2 * (t - Math.floor(t)) - 1; } },
    { name: "半波", f: function (t) { return Math.max(Math.sin(TAU * t), 0) - 1 / Math.PI; } },
    { name: "全波", f: function (t) { return Math.abs(Math.sin(TAU * t)) - 2 / Math.PI; } },
    { name: "脉冲", f: function (t) { return (t >= 0.125 && t < 0.375 ? 1 : 0) - 0.25; } }
  ];

  /* 把候选波形归一成零均值、单位峰值，再对相位和幅度做最小二乘匹配 */
  var CLASS_SHAPES = null;
  function classShapes() {
    if (CLASS_SHAPES) return CLASS_SHAPES;
    CLASS_SHAPES = CLASSES.map(function (c) {
      var y = new Float64Array(M), i, mean = 0, peak = 0;
      for (i = 0; i < M; i++) y[i] = c.f(i / M);
      for (i = 0; i < M; i++) mean += y[i];
      mean /= M;
      for (i = 0; i < M; i++) { y[i] -= mean; peak = Math.max(peak, Math.abs(y[i])); }
      for (i = 0; i < M; i++) y[i] /= peak || 1;
      return { name: c.name, y: y };
    });
    return CLASS_SHAPES;
  }

  function classify(target) {
    var shapes = classShapes();
    var sy = 0, i, s, sh;
    for (i = 0; i < M; i++) sy += target[i] * target[i];
    var best = null;
    for (s = 0; s < shapes.length; s++) {
      var c = shapes[s].y;
      for (sh = 0; sh < 96; sh++) {
        var off = Math.round(sh * M / 96), dot = 0, cc = 0;
        for (i = 0; i < M; i++) {
          var cv = c[(i + off) % M];
          dot += target[i] * cv;
          cc += cv * cv;
        }
        var score = Math.abs(dot) / Math.sqrt(cc * sy || 1);
        if (!best || score > best.score) best = { name: shapes[s].name, score: score };
      }
    }
    if (best && best.score >= 0.975) {
      return { name: best.name, score: best.score, dist: 1 - best.score, free: false };
    }
    return { name: "自由波形", score: best ? best.score : 0, dist: 1 - (best ? best.score : 0), free: true };
  }

  /* ---------------- term typesetting ---------------- */

  function latexTerm(t) {
    var arg = (t.n === 1 ? "" : String(t.n)) + "\\omega t";
    if (Math.abs(t.phi) >= 0.005) {
      arg += (t.phi > 0 ? " + " : " - ") + Math.abs(t.phi).toFixed(2);
    }
    return Math.abs(t.R).toFixed(2) + "\\sin(" + arg + ")";
  }

  function generalFormulaHTML() {
    return '<span class="fit-lead">y(t) ≈</span>' +
      '<span class="fit-term ph"><i>R</i><sub>1</sub>&thinsp;<span class="fn">sin</span>(<i>ωt</i> + <i>φ</i><sub>1</sub>)</span>' +
      '<span class="fit-term ph"><span class="fit-plus">+</span> <i>R</i><sub>2</sub>&thinsp;<span class="fn">sin</span>(2<i>ωt</i> + <i>φ</i><sub>2</sub>)</span>' +
      '<span class="fit-more">+ ⋯</span>';
  }

  var GENERAL_TEX = "y(t)\\approx R_{1}\\sin(\\omega t+\\varphi_{1})+R_{2}\\sin(2\\omega t+\\varphi_{2})+\\cdots";

  /* ---------------- scene ---------------- */

  var F = {
    cv: null, ctx: null, w: 0, h: 0,
    raw: null, drawing: false,
    fitY: null, terms: [], curves: [], cums: [],
    bad: null, k: 0, sweep: 0, holdT: 0,
    phase: "idle", rawAlpha: 0, targetAlpha: 0,
    latex: "", guess: null,

    enter: function () { this.resize(); },
    leave: function () {},

    init: function () {
      var self = this;
      this.cv = $("#fitCanvas");
      this.formula = $("#fitFormula");
      this.texEl = $("#fitTex");
      this.note = $("#fitNote");
      this.count = $("#fitCount");
      this.term = $("#fitTerm");
      this.prog = $("#fitProg");
      this.badge = $("#fitBadge");
      this.hint = $("#fitHint");

      this.cv.addEventListener("pointerdown", function (e) { self.down(e); });
      this.cv.addEventListener("pointermove", function (e) { self.move(e); });
      this.cv.addEventListener("pointerup", function (e) { self.up(e); });
      this.cv.addEventListener("pointercancel", function (e) { self.up(e); });

      this.loop = true;
      $("#fitLoop").addEventListener("click", function () {
        self.loop = !self.loop;
        this.classList.toggle("on", self.loop);
        this.setAttribute("aria-pressed", String(self.loop));
        if (self.loop && self.phase === "done") self.holdT = 0;
      });
      $("#fitReplay").addEventListener("click", function () { self.replay(); });
      $("#fitClear").addEventListener("click", function () { self.clearAll(true); });
      $("#fitCopy").addEventListener("click", function () { self.copyTex(this); });
      $$("#fitDemo button").forEach(function (b) {
        b.addEventListener("click", function () { self.demo(b.getAttribute("data-demo")); });
      });

      this.clearAll(false);
      this.resize();
    },

    plot: function () {
      var w = this.w, h = this.h;
      var l = 46, r = 22, t = 26, b = 38;
      var x0 = l, x1 = w - r, yt = t, yb = h - b;
      var mid = (yt + yb) / 2;
      var unit = (yb - yt) / 2 * 0.84;
      return {
        x0: x0, x1: x1, yt: yt, yb: yb, mid: mid, unit: unit,
        px: function (u) { return x0 + u * (x1 - x0); },
        py: function (v) { return mid - v * unit; }
      };
    },

    toData: function (e) {
      var p = pos(this.cv, e), P = this.plot();
      return {
        u: (p.x - P.x0) / (P.x1 - P.x0),
        v: (P.mid - p.y) / P.unit
      };
    },

    resize: function () {
      if (!this.cv) return;
      var r = fit(this.cv);
      this.ctx = r.ctx; this.w = r.w; this.h = r.h;
      this.draw();
    },

    /* ---------- drawing ---------- */

    down: function (e) {
      if (!this.ctx) return;
      var d = this.toData(e);
      this.drawing = true;
      this.raw = [d];
      this.rawAlpha = 1;
      this.phase = "idle";
      this.fitY = null; this.terms = []; this.curves = []; this.cums = [];
      this.bad = null; this.k = 0; this.sweep = 0; this.holdT = 0;
      this.targetAlpha = 0;
      this.formula.style.fontSize = "";
      this.formula.innerHTML = generalFormulaHTML();
      this.formula.classList.add("empty");
      this.latex = GENERAL_TEX;
      this.texEl.textContent = GENERAL_TEX;
      this.badge.style.display = "none";
      this.count.textContent = "绘制中";
      this.term.textContent = "";
      this.prog.style.width = "0%";
      this.note.textContent = "松手，开始识别与拟合。";
      this.hint.classList.add("hide");
      try { this.cv.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    },

    move: function (e) {
      if (!this.drawing) return;
      var p = pos(this.cv, e);
      var last = this.raw[this.raw.length - 1];
      var P = this.plot();
      if (Math.hypot(p.x - P.px(last.u), p.y - P.py(last.v)) > 1.4) {
        this.raw.push(this.toData(e));
      }
      e.preventDefault();
    },

    up: function (e) {
      if (!this.drawing) return;
      this.drawing = false;
      try { this.cv.releasePointerCapture(e.pointerId); } catch (err) {}
      this.rawAlpha = 1;
      if (!this.raw || this.raw.length < 10) { this.reject("笔画太短——横着画满一个周期再松手。"); return; }
      var y = this.sample();
      if (!y) { this.reject("横跨得不够——从左到右画一个周期。"); return; }
      this.build(y);
    },

    reject: function (msg) {
      this.raw = null;
      this.rawAlpha = 0;
      this.hint.classList.remove("hide");
      this.count.textContent = "等待一笔";
      this.note.textContent = msg;
      this.draw();
    },

    /* 把这一笔重采样成一个周期上的 512 个数：先按横向跨度归一，再按峰值归一 */
    sample: function () {
      var raw = this.raw, i, n = raw.length;
      var minU = Infinity, maxU = -Infinity;
      for (i = 0; i < n; i++) {
        if (raw[i].u < minU) minU = raw[i].u;
        if (raw[i].u > maxU) maxU = raw[i].u;
      }
      if (maxU - minU < 0.12) return null;

      var acc = new Float64Array(M), cnt = new Float64Array(M);
      for (i = 0; i < n; i++) {
        var u = (raw[i].u - minU) / (maxU - minU);
        var c = Math.round(u * (M - 1));
        for (var d = -2; d <= 2; d++) {
          var q = c + d;
          if (q >= 0 && q < M) { acc[q] += raw[i].v; cnt[q]++; }
        }
      }

      var y = new Float64Array(M), filled = 0, first = -1, last = -1;
      for (i = 0; i < M; i++) {
        if (cnt[i] > 0) {
          y[i] = acc[i] / cnt[i];
          filled++;
          if (first < 0) first = i;
          last = i;
        } else {
          y[i] = NaN;
        }
      }
      if (filled < M * 0.55) return null;

      for (i = first; i <= last; i++) {
        if (!isNaN(y[i])) continue;
        var a = i - 1;
        while (a >= first && isNaN(y[a])) a--;
        var b = i + 1;
        while (b <= last && isNaN(y[b])) b++;
        y[i] = y[a] + (y[b] - y[a]) * (i - a) / (b - a);
      }
      for (i = 0; i < first; i++) y[i] = y[first];
      for (i = last + 1; i < M; i++) y[i] = y[last];

      /* 端点不做环绕平滑：接缝处本来就是一个跳变，不该被抹成斜坡 */
      for (var pass = 0; pass < 2; pass++) {
        var sm = new Float64Array(M);
        for (i = 0; i < M; i++) {
          sm[i] = 0.25 * y[i > 0 ? i - 1 : 0] + 0.5 * y[i] + 0.25 * y[i < M - 1 ? i + 1 : M - 1];
        }
        y = sm;
      }

      var mean = 0;
      for (i = 0; i < M; i++) mean += y[i];
      mean /= M;
      var peak = 0;
      for (i = 0; i < M; i++) { y[i] -= mean; peak = Math.max(peak, Math.abs(y[i])); }
      if (peak < 0.05) return null;
      for (i = 0; i < M; i++) y[i] /= peak;
      return y;
    },

    build: function (y) {
      var an = analyze(y, ANALYZE_N);
      var i, Rmax = 0;
      for (i = 0; i < an.terms.length; i++) Rmax = Math.max(Rmax, an.terms[i].R);

      var thr = Math.max(0.015, 0.022 * Rmax);
      var lastN = 1;
      for (i = 0; i < an.terms.length; i++) {
        if (an.terms[i].R >= thr) lastN = i + 1;
      }
      lastN = Math.min(lastN, ANALYZE_N);

      var picked = [];
      for (i = 0; i < lastN; i++) {
        if (an.terms[i].R >= 0.018 * Rmax) picked.push(an.terms[i]);
      }
      if (!picked.length) picked = [an.terms[0]];
      if (picked.length > MAX_TERMS) picked = picked.slice(0, MAX_TERMS);

      /* 把相位折进 ( -π/2, π/2 ]，允许负振幅，公式更像课本里的级数 */
      for (i = 0; i < picked.length; i++) {
        var pp = picked[i].phi;
        if (pp > Math.PI / 2) { picked[i].phi = pp - Math.PI; picked[i].R = -picked[i].R; }
        else if (pp < -Math.PI / 2) { picked[i].phi = pp + Math.PI; picked[i].R = -picked[i].R; }
      }

      this.fitY = y;
      this.terms = picked;
      this.curves = [];
      this.cums = [];
      var cum = new Float64Array(M);
      for (i = 0; i < picked.length; i++) {
        var arr = termCurve(picked[i]);
        this.curves.push(arr);
        for (var j = 0; j < M; j++) cum[j] += arr[j];
        this.cums.push(new Float64Array(cum));
      }
      this.guess = classify(y);
      this.bad = null;

      var sum = this.cums[this.cums.length - 1];
      this.fullR2 = r2(y, sum);

      this.badge.textContent = (this.guess.free ? "" : "≈ ") + this.guess.name;
      this.badge.className = "fo-badge" + (this.guess.free ? " fin" : "");
      this.badge.style.display = "";

      var nTerms = picked.length;
      var fs = nTerms <= 5 ? 25 : nTerms <= 8 ? 23 : nTerms <= 12 ? 20 : 19;
      this.formula.style.fontSize = fs + "px";
      this.perRow = nTerms <= 5 ? 0 : (nTerms <= 12 ? Math.ceil(nTerms / 2) : Math.ceil(nTerms / 3));

      this.phase = "anim";
      this.k = 0;
      this.sweep = 0;
      this.holdT = 0;
      this.finaleT = 0;
      this.targetAlpha = 0;
      this.stepDur = Math.max(0.2, Math.min(0.56, 4.6 / nTerms));
      this.holdDur = nTerms > 8 ? 0.12 : nTerms > 5 ? 0.2 : 0.24;

      this.formula.classList.remove("empty");
      this.formula.innerHTML = '<span class="fit-lead">y(t) ≈</span>';
      this.appendTerm(0);
      this.syncUI();
    },

    appendTerm: function (k) {
      var old = this.formula.querySelector(".fit-term.hot");
      if (old) old.classList.remove("hot");
      var more = this.formula.querySelector(".fit-more");
      if (more) more.remove();

      if (this.perRow && k > 0 && k % this.perRow === 0) this.formula.appendChild(document.createElement("br"));

      var t = this.terms[k];
      var neg = t.R < 0;
      var span = document.createElement("span");
      span.className = "fit-term" + (k === 0 ? " first" : "") + " hot";
      span.innerHTML = (k === 0
          ? (neg ? '<span class="fit-sign">−</span> ' : "")
          : '<span class="fit-plus">' + (neg ? "−" : "+") + "</span> ") +
        '<span class="fit-co">' + Math.abs(t.R).toFixed(2) + "</span> " +
        '<span class="fn">sin</span>(' + this.argHTML(t) + ")";
      this.formula.appendChild(document.createTextNode(" "));
      this.formula.appendChild(span);

      if (k < this.terms.length - 1) {
        var m = document.createElement("span");
        m.className = "fit-more";
        m.textContent = "+ ⋯";
        this.formula.appendChild(document.createTextNode(" "));
        this.formula.appendChild(m);
      }
    },

    argHTML: function (t) {
      var arg = (t.n === 1 ? "" : String(t.n)) + "<i>ωt</i>";
      if (Math.abs(t.phi) >= 0.005) {
        arg += (t.phi > 0 ? " + " : " − ") + Math.abs(t.phi).toFixed(2);
      }
      return arg;
    },

    latexFor: function (count) {
      var s = "y(t)\\approx ";
      for (var i = 0; i < count; i++) {
        var t = this.terms[i];
        if (i === 0) {
          if (t.R < 0) s += "-";
        } else {
          s += t.R < 0 ? " - " : " + ";
        }
        s += latexTerm(t);
      }
      if (count > 1) s += " + \\cdots";
      return s;
    },

    syncUI: function () {
      var k = this.k;
      var t = this.terms[k];
      this.count.innerHTML = "第 <b>" + (k + 1) + "</b> / " + this.terms.length + " 项";
      this.term.textContent = "· 刚加：" + (t.n === 1 ? "基波" : t.n + " 次谐波");
      this.prog.style.width = ((k + 1) / this.terms.length * 100).toFixed(1) + "%";
      this.latex = this.latexFor(k + 1);
      this.texEl.textContent = this.latex;
      var q = r2(this.fitY, this.cums[k]);
      this.note.textContent = "第 " + (k + 1) + " 项 · R² " + q.toFixed(3) + " · 蓝线是刚加的谐波";
    },

    fullFormula: function () {
      var hot = this.formula.querySelector(".fit-term.hot");
      if (hot) hot.classList.remove("hot");
      var more = this.formula.querySelector(".fit-more");
      if (more) more.remove();
      this.count.innerHTML = "第 <b>" + this.terms.length + "</b> / " + this.terms.length + " 项";
      this.prog.style.width = "100%";
      this.latex = this.latexFor(this.terms.length);
      this.texEl.textContent = this.latex;
    },

    startFinale: function () {
      this.fullFormula();
      this.phase = "finale";
      this.finaleT = 0;
      this.term.textContent = "· 整体合成";
      this.note.textContent = "把 " + this.terms.length + " 项叠成一条波——整体再画一遍。";
    },

    finish: function () {
      this.fullFormula();
      this.phase = "done";
      this.holdT = 0;
      this.term.textContent = "· 拟合完成";

      var conf = Math.max(0, Math.round((1 - this.guess.dist) * 100));
      var head = this.guess.free
        ? "未匹配标准波形，按自由波形拟合"
        : "识别为" + this.guess.name + "（相似 " + conf + "%）";
      this.note.textContent = head + " · " + this.terms.length + " 项，R² = " +
        this.fullR2.toFixed(3) + " · ω = 2π/T，去均值、按峰值归一";
    },

    replay: function () {
      if (!this.terms.length) return;
      var hot = this.formula.querySelector(".fit-term.hot");
      if (hot) hot.classList.remove("hot");
      this.phase = "anim";
      this.k = 0;
      this.sweep = 0;
      this.holdT = 0;
      this.finaleT = 0;
      this.targetAlpha = 1;
      this.formula.innerHTML = '<span class="fit-lead">y(t) ≈</span>';
      this.appendTerm(0);
      this.syncUI();
    },

    clearAll: function (showHint) {
      this.raw = null;
      this.drawing = false;
      this.fitY = null;
      this.terms = []; this.curves = []; this.cums = [];
      this.bad = null; this.k = 0; this.sweep = 0; this.holdT = 0;
      this.phase = "idle";
      this.rawAlpha = 0;
      this.targetAlpha = 0;
      this.guess = null;
      this.finaleT = 0;
      this.formula.style.fontSize = "";
      this.latex = GENERAL_TEX;
      this.formula.classList.add("empty");
      this.formula.innerHTML = generalFormulaHTML();
      this.texEl.textContent = GENERAL_TEX;
      this.badge.style.display = "none";
      this.note.textContent = "画一笔：横轴是一个周期 T，去均值、按峰值归一；松手即逐项拟合。";
      this.count.textContent = "等待一笔";
      this.term.textContent = "";
      this.prog.style.width = "0%";
      if (showHint) this.hint.classList.remove("hide");
      this.draw();
    },

    /* ---------- samples ---------- */

    demo: function (name) {
      if (!this.ctx) this.resize();
      var P = this.plot();
      var fn = {
        sine: function (t) { return Math.sin(TAU * t); },
        square: function (t) { return Math.sin(TAU * t) >= 0 ? 0.82 : -0.82; },
        triangle: function (t) { return 0.8 * (2 / Math.PI) * Math.asin(Math.sin(TAU * t)); },
        saw: function (t) { return 0.8 * (2 * (t - Math.floor(t)) - 1); },
        hand: function (t) {
          return 0.72 * Math.sin(TAU * t + 0.4) + 0.24 * Math.sin(2 * TAU * t + 1.2)
            + 0.13 * Math.sin(3 * TAU * t + 2.0)
            + 0.26 * Math.exp(-Math.pow((t - 0.62) / 0.07, 2));
        }
      }[name];
      if (!fn) return;

      var pts = [], steps = 260;
      for (var i = 0; i <= steps; i++) {
        var t = i / steps;
        var v = fn(t);
        v += 0.010 * Math.sin(t * 39.1 + 1.7) + 0.006 * Math.sin(t * 83.7 + 0.4);
        var jitter = (Math.sin(t * 51.3 + 2.1) + Math.sin(t * 17.7)) * 0.0015;
        pts.push({ u: 0.02 + 0.96 * t + jitter, v: v });
      }

      this.raw = pts;
      this.rawAlpha = 1;
      this.drawing = false;
      this.hint.classList.add("hide");
      this.note.textContent = "松手，开始识别与拟合。";
      this.count.textContent = "绘制中";
      this.formula.innerHTML = "";
      this.formula.classList.remove("empty");
      this.badge.style.display = "none";
      this.term.textContent = "";
      this.prog.style.width = "0%";
      var y = this.sample();
      if (!y) return;
      this.build(y);
    },

    /* ---------- animation ---------- */

    jump: function (spec) {
      if (!this.terms.length) return;
      this.targetAlpha = 1;
      this.rawAlpha = 0;
      if (spec === "done") {
        this.formula.innerHTML = '<span class="fit-lead">y(t) ≈</span>';
        for (var i = 0; i < this.terms.length; i++) this.appendTerm(i);
        this.k = this.terms.length - 1;
        this.sweep = 1;
        this.finish();
      } else if (spec === "finale") {
        this.formula.innerHTML = '<span class="fit-lead">y(t) ≈</span>';
        for (var q = 0; q < this.terms.length; q++) this.appendTerm(q);
        this.k = this.terms.length - 1;
        this.sweep = 1;
        this.startFinale();
        this.finaleT = 0.7;
        this.draw();
        return;
      } else {
        var parts = String(spec).split(".");
        var k = Math.min(this.terms.length - 1, Math.max(0, parseInt(parts[0], 10) || 0));
        var frac = parts.length > 1 ? Math.min(1, Math.max(0, parseFloat("0." + parts[1]))) : 1;
        this.formula.innerHTML = '<span class="fit-lead">y(t) ≈</span>';
        for (i = 0; i <= k; i++) this.appendTerm(i);
        this.k = k;
        this.sweep = frac;
        this.phase = "anim";
        this.syncUI();
      }
      this.draw();
    },

    frame: function (now, dt) {
      if (this.drawing) { this.draw(); return; }
      if (this.rawAlpha > 0) this.rawAlpha = Math.max(0, this.rawAlpha - dt / 0.32);
      if (this.phase !== "idle" && this.targetAlpha < 1) {
        this.targetAlpha = Math.min(1, this.targetAlpha + dt / 0.32);
      }
      if (this.phase === "anim") {
        if (this.sweep < 1) {
          this.sweep = Math.min(1, this.sweep + dt / (this.stepDur || 0.56));
          if (this.sweep >= 1) this.holdT = 0;
        } else {
          this.holdT += dt;
          if (this.holdT >= (this.holdDur || 0.24)) {
            this.holdT = 0;
            if (this.k + 1 < this.terms.length) {
              this.k++;
              this.sweep = 0;
              this.appendTerm(this.k);
              this.syncUI();
            } else {
              this.startFinale();
            }
          }
        }
      } else if (this.phase === "finale") {
        this.finaleT += dt;
        if (this.finaleT >= 1.55) this.finish();
      } else if (this.phase === "done" && this.loop) {
        this.holdT += dt;
        if (this.holdT >= 5.0) this.replay();
      }
      this.draw();
    },

    /* ---------- render ---------- */

    draw: function () {
      var ctx = this.ctx;
      if (!ctx) return;
      var P = this.plot(), W = this.w, H = this.h;
      ctx.clearRect(0, 0, W, H);

      /* grid */
      ctx.strokeStyle = "rgba(26,34,46,.055)";
      ctx.lineWidth = 1;
      for (var k = 0; k <= 4; k++) {
        var X = P.px(k / 4);
        ctx.beginPath(); ctx.moveTo(X, P.yt); ctx.lineTo(X, P.yb); ctx.stroke();
      }

      /* ±1 guides */
      [1, -1].forEach(function (v) {
        ln(ctx, P.x0, P.py(v), P.x1, P.py(v), C.grid, 1, [2, 6]);
      });

      /* axes */
      ln(ctx, P.x0, P.mid, P.x1 + 6, P.mid, "rgba(26,34,46,.42)", 1.1);
      ln(ctx, P.x0, P.yb, P.x0, P.yt - 6, "rgba(26,34,46,.42)", 1.1);
      ln(ctx, P.x0, P.yb, P.x1, P.yb, "rgba(26,34,46,.22)", 1.1);

      ctx.save();
      ctx.fillStyle = "rgba(26,34,46,.42)";
      ctx.beginPath(); ctx.moveTo(P.x1 + 6, P.mid); ctx.lineTo(P.x1, P.mid - 3.5); ctx.lineTo(P.x1, P.mid + 3.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(P.x0, P.yt - 6); ctx.lineTo(P.x0 - 3.5, P.yt); ctx.lineTo(P.x0 + 3.5, P.yt); ctx.closePath(); ctx.fill();
      ctx.restore();

      /* x ticks + labels */
      ctx.fillStyle = C.tick;
      ctx.font = '9px "Microsoft YaHei", sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      var xl = ["0", "T/4", "T/2", "3T/4", "T"];
      for (k = 0; k <= 4; k++) {
        var XX = P.px(k / 4);
        ctx.strokeStyle = "rgba(26,34,46,.35)";
        ctx.beginPath(); ctx.moveTo(XX, P.yb); ctx.lineTo(XX, P.yb + 4); ctx.stroke();
        ctx.fillText(xl[k], XX, H - 8);
      }

      /* y labels */
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = C.tick;
      ["1", "0", "−1"].forEach(function (a, i) {
        var v = i === 0 ? 1 : i === 1 ? 0 : -1;
        ctx.strokeStyle = "rgba(26,34,46,.35)";
        ctx.beginPath(); ctx.moveTo(P.x0 - 3, P.py(v)); ctx.lineTo(P.x0 + 3, P.py(v)); ctx.stroke();
        ctx.fillText(a, P.x0 - 7, P.py(v));
      });

      /* target : the drawn one-period wave */
      if (this.fitY && this.targetAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = this.targetAlpha;
        ctx.strokeStyle = C.target;
        ctx.lineWidth = 1.4;
        ctx.setLineDash([5, 7]);
        ctx.beginPath();
        for (var i = 0; i < M; i++) {
          var x = P.px(i / (M - 1)), y = P.py(this.fitY[i]);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }

      /* raw ink while drawing / fading out */
      if (this.raw && this.rawAlpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = this.rawAlpha;
        ctx.strokeStyle = "rgba(26,34,46,.72)";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        for (var p = 0; p < this.raw.length; p++) {
          var rx = P.px(this.raw[p].u), ry = P.py(this.raw[p].v);
          if (p === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
        }
        ctx.stroke();
        ctx.restore();
      }

      if (!this.cums.length) return;

      /* 收尾：把最终的合成波从头到尾整体再画一遍 */
      if (this.phase === "finale") {
        var last = this.terms.length - 1;
        var ft = Math.min(1, Math.max(0, (this.finaleT - 0.1) / 1.3));
        var fe = ft < 0.5 ? 2 * ft * ft : 1 - Math.pow(-2 * ft + 2, 2) / 2;
        var fup = Math.max(1, Math.round(fe * M));
        this.strokeArr(this.cums[last], M, C.red, 2.3, 0.10);
        this.strokeArr(this.cums[last], fup, "rgba(192,57,43,.16)", 7, 1);
        this.strokeArr(this.cums[last], fup, C.red, 2.3, 1);
        var fh = Math.min(M - 1, fup);
        dot(ctx, P.px(fh / (M - 1)), P.py(this.cums[last][fh]), 4, C.red, true);
        return;
      }

      var idx = this.phase === "done" ? this.terms.length - 1 : this.k;
      var frac = this.phase === "done" ? 1 : this.sweep;
      var upto = Math.max(1, Math.round(frac * M));

      /* previous partial sum, ghosted, so the new one can grow over it */
      if (this.phase === "anim" && idx > 0 && frac < 1) {
        this.strokeArr(this.cums[idx - 1], M, C.red, 1.6, 0.18);
      }

      /* latest term */
      if (this.phase === "anim") {
        this.strokeArr(this.curves[idx], upto, "rgba(58,110,165,.82)", 1.2, 1);
      }

      /* partial sum */
      this.strokeArr(this.cums[idx], upto, C.red, 2.3, 1);

      /* sweep head */
      if (this.phase === "anim") {
        var hi = Math.min(M - 1, upto);
        dot(ctx, P.px(hi / (M - 1)), P.py(this.cums[idx][hi]), 4, C.red, true);
      }
    },

    strokeArr: function (arr, upto, color, width, alpha) {
      var ctx = this.ctx, P = this.plot();
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      for (var i = 0; i < upto; i++) {
        var x = P.px(i / (M - 1)), y = P.py(arr[i]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    },

    copyTex: function (btn) {
      var text = this.latex || GENERAL_TEX;
      var done = function () {
        btn.textContent = "已复制";
        setTimeout(function () { btn.textContent = "复制"; }, 1200);
      };
      var fallback = function () {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    }
  };


    return F;
  })();

  Scenes = [s5, FitScene, s6, s4];
  Scenes.forEach(function (s) { if (s.init) s.init(); });

  fitStage();
  var h = parseInt((location.hash || "").replace("#", ""), 10);
  if (h >= 1 && h <= 4) {
    active = h - 1;
    tabs.forEach(function (t, j) { t.classList.toggle("on", j === active); });
    sceneEls.forEach(function (s, j) { s.classList.toggle("on", j === active); });
    dots.forEach(function (d, j) { d.classList.toggle("on", j === active); });
  }
  requestAnimationFrame(function () {
    Scenes[active].resize();
    Scenes[active].enter();
  });

  var last = performance.now();
  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var s = Scenes[active];
    if (s && s.frame) s.frame(now / 1000, dt);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

})();
</script>
